1 |\n---\n**الدعاء بين السجدتين**\n**رب اغفر لي رب اغفر لي، اللهم اغفر لي، وارحمني واهدني واجبرني وعافني وارزقني وارفعني** | 01 |\n---\n**دعاء من استصعب عليه أمر**\n**اللهم لاسهل إلا ماجعلته سهلا وأنت تجعل الحزن إذا شئت سهلا** | 01 |\n---\n**دعاء الخوف من الشرك**\n**اللهم إني أعوذ بك أن أشرك بك وأنا أعلم، وأستغفرك لما لا أعلم** | 01 |\n---\n**ما يقال في المجلس**\n**رب اغفر لي وتب عليّ إنك أنت التواب الغفور** | 100 |\n---\n**كفارة المجلس**\n**سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت أستغفرك وأتوب إليك** | 01 |\n---\n**دعاء من رأى مبتلى**\n**الحمد لله الذي عافاني مما ابتلا به وفضلني على كثير ممن خلق تفضيلاً** | 01 |\n---\n**دعاء الغضب**\n**أعوذ بالله من الشيطان الرجيم** | 01 |\n---\n**الدعاء للمتزوج**\n**بارك الله لك، وبارك عليك، وجمع بينكما في خير** | 01 |\n---\n**دعاء المتزوج لنفسه**\n**اللهم إني أسألك خيرها وخير ما جبلتها عليه وأعوذ بك من شرها وشر ما جبلتها عليه** | 01 |\n---\n**الدعاء قبل الجماع**\n**بسم الله ـ اللهم جنبنا الشيطان، وجنب الشيطان مارزقتنا** | 01 |\n---\n**دعاء العطاس**\n**إذا عطس أحدكم فليقل: الحمد لله، وليقل له أخوه أو صاحبه: يرحمك الله، فإذا قال له: يرحمك الله، فليقل: يهديكم الله ويصلح بالكم.** | 01 |\n---\n**الدعاء عند إفطار الصائم**\n**ذهب الظمأ، وابتلت العروق، وثبت الأجر إن شاء الله** | 01 |\n---\n**الدعاء إذا أفطر عند أهل بيت**\n**أفطر عندكم الصائمون، وأكل طعامكم الأبرار، وصلت عليكم الملائكة** | 01 |\n---\n**دعاء رؤية الهلال**\n**الله أكبر، اللهم أهله علينا بالأمن، والإيمان والسلامة، والإسلام، والتوفيق لما تحب وترضى ربنا وربك الله.** | 01 |\n---\n**دعاء من أصيب بمصيبة**\n**إنا لله وإنا إليه راجعون اللهم أجرني في مصيبتي واخلف لي خيرا منها** | 01 |\n---\n**الدعاء للمريض في عيادته**\n**لابأس طهور إن شاء الله، ما من عبد مسلم يعود مريضاً لم يحضر أجله فيقول سبع مرات: أسأل الله العظيم رب العرش العظيم أن يشفيك إلا عوفي.** | 01 |\n---\n**دعاء المريض الذي يئس من حياته**\n**اللهم اغفر لي وارحمني والحقني بالرفيق الأعلى** | 01 |\n---\n**ما يعوذ به الأولاد**\n**أعيذكما بكلمات الله التامة من كل شيطان وهامة، ومن كل عين لامة** | 01 |\n---\n**دعاء لقاء العدو وذي السلطان**\n**حسبنا الله ونعم الوكيل. اللهم إنا نجعلك في نحورهم ونعوذ بك من شرورهم. اللهم أنت عضدي وأنت نصيري، بك أجول وبك أصول وبك أقاتل.** | 01 |\n---\n**دعاء صلاة الاستخارة**\n**اللهم إني أستخيرك بعلمك، وأستقدرك بقدرتك وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر وتعلم ولا أعلم وأنت علام الغيوب...** | 01 |\n---\n**دعاء سجود التلاوة**\n**سجد وجهي للذي خلقه وشق سمعه وبصره بحوله وقوته، فتبارك الله أحسن الخالقين** | 01 |\n---\n**دعاء الاستفتاح**\n**اللهم باعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب، اللهم نقني من خطاياي كما ينقى الثوب الأبيض من الدنس، اللهم اغسلني من خطاياي بالثلج والماء والبرد.** | 01 |\n---\n**دعاء دخول السوق**\n**لا إله إلا الله وحده لا شريك له، له الملك وله الحمد يحيي ويميت وهو حي لا يموت بيده الخير وهو على كل شيء قدير.** | 01 |\n---\n**عند فعل الذنب أو ارتكاب المعصية**\n**ما من عبد يذنب ذنباً فيتوضأ فيحسن الطهور، ثم يقوم فيصلي ركعتين، ثم يستغفر الله لذلك الذنب إلا غفر له.** | 01 |\n---\n**الدعاء عند سماع أصوات الحيوانات**\n**اللهم إني أسألك من فضلك. أعوذ بالله من الشيطان الرجيم.** | 01 |\n---\n**سيد الاستغفار**\n**اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت أعوذ بك من شر ما صنعت، أبوئ لك بنعمتك علي وأبوئ بذنبي، فاغفر لي فإنه لا يغفر الذنوب إلا أنت.** | 01 |\n---\n**الدعاء إذا أحسست بوجع في جسدك**\n**بسم الله، ثلاثاً، وأعوذ بالله وقدرته من شر ما أجد وأحاذر، سبع مرات.** | 01 |\n---\n**ما يقول ويفعل من أذنب ذنباً**\n**ما من عبد يذنب ذنباً فيحسن الطهور ثم يقوم فيصلي ركعتين ثم يستغفر الله إلا غفر له.** | 01 |", "أذكار المساء": "**أذكار المساء**\n\n**أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ**\n**اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ... [البقرة 255].** | 01 |\n---\n**أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ**\n**آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ... [البقرة 285-286].** | 01 |\n---\n**قُلْ هُوَ ٱللَّهُ أَحَدٌ...** | 03 |\n---\n**قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ...** | 03 |\n---\n**قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ...** | 03 |\n---\n**أَمْسَيْـنا وَأَمْسـى المـلكُ لله وَالحَمدُ لله... رَبِّ أَعـوذُ بِكَ مِنْ عَـذابٍ في النّـارِ وَعَـذابٍ في القَـبْر.** | 01 |\n---\n**اللّهـمَّ أَنْتَ رَبِّـي لا إلهَ إلاّ أَنْتَ...** | 01 |\n---\n**رَضيـتُ بِاللهِ رَبَّـاً وَبِالإسْلامِ ديـناً وَبِمُحَـمَّدٍ صلى الله عليه وسلم نَبِيّـاً.** | 03 |\n---\n**اللّهُـمَّ إِنِّـي أَمسيتُ أُشْـهِدُك...** | 04 |\n---\n**اللّهُـمَّ ما أَمسى بي مِـنْ نِعْـمَةٍ...** | 01 |\n---\n**حَسْبِـيَ اللّهُ لا إلهَ إلاّ هُوَ...** | 07 |\n---\n**بِسـمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِـهِ...** | 03 |\n---\n**اللّهُـمَّ بِكَ أَمْسَـينا وَبِكَ أَصْـبَحْنا، وَبِكَ نَحْـيا وَبِكَ نَمُـوتُ وَإِلَـيْكَ الْمَصِيرُ.** | 01 |\n---\n**أَمْسَيْنَا عَلَى فِطْرَةِ الإسْلاَمِ...** | 01 |\n---\n**سُبْحـانَ اللهِ وَبِحَمْـدِهِ عَدَدَ خَلْـقِه...** | 03 |\n---\n**اللّهُـمَّ عافِـني في بَدَنـي...** | 03 |\n---\n**اللّهُـمَّ إِنّـي أَعـوذُ بِكَ مِنَ الْكُـفر...** | 03 |\n---\n**اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ...** | 01 |\n---\n**يَا حَيُّ يَا قيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ...** | 03 |\n---\n**أَمْسَيْنا وَأَمْسَى الْمُلْكُ للهِ رَبِّ الْعَالَمَيْنِ...** | 01 |\n---\n**اللّهُـمَّ عالِـمَ الغَـيْبِ وَالشّـهادَةِ...** | 01 |\n---\n**أَعـوذُ بِكَلِمـاتِ اللّهِ التّـامّـاتِ مِنْ شَـرِّ ما خَلَـق.** | 03 |\n---\n**اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.** | 10 |\n---\n**اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ...** | 03 |\n---\n**اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ...** | 03 |\n---\n**أسْتَغْفِرُ اللهَ العَظِيمَ...** | 03 |\n---\n**يَا رَبِّ، لَكَ الْحَمْدُ كَمَا يَنْبَغِي...** | 03 |\n---\n**لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ...** | 100 |\n---\n**اللَّهُمَّ أَنْتَ رَبِّي... ذكر طيب.** | 01 |\n---\n**سُبْحـانَ اللهِ وَبِحَمْـدِهِ.** | 100 |"};

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mdToHtml(md){
  md=md.replace(/\r/g,'').replace(/\[\*\*Advertisement\*\*\]\([^\n]+\)/g,'');
  let blocks=md.split(/\n---\n/g);
  let out=[];
  for(const b0 of blocks){
    let b=b0.trim(); if(!b) continue;
    let countMatch=b.match(/\|\s*(\d+)\s*\|/g); let count=countMatch?parseInt(countMatch[countMatch.length-1].match(/(\d+)/)[1]):null;
    b=b.replace(/\|[^\n]*\|/g,'').replace(/\*\*Advertisement\*\*[^\n]*/g,'').trim();
    b=b.replace(/^\*\*(.+?)\*\*$/gm,'<strong>$1</strong>');
    b=b.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    b=b.replace(/^###\s+(.+)$/gm,'<h4>$1</h4>').replace(/^##\s+(.+)$/gm,'<h3>$1</h3>').replace(/^#\s+(.+)$/gm,'<h2>$1</h2>');
    b=b.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
    if(count) b+=`<div style="color:var(--muted);margin-top:10px">التكرار: ${count}</div>`;
    out.push('<div class="card">'+b+'</div>');
  }
  return out.join('');
}
function parseItems(md){
  const parts=md.split(/\n---\n/g).map(x=>x.trim()).filter(Boolean), items=[];
  for(const p0 of parts){let p=p0;let m=p.match(/\|\s*(\d+)\s*\|/g);let target=m?parseInt(m[m.length-1].match(/(\d+)/)[1]):1;p=p.replace(/\|[^\n]*\|/g,'').trim();
    p=p.replace(/^\*\*(.*?)\*\*/s,'$1'); p=p.replace(/\*\*/g,''); items.push({text:p,count:target});}
  return items.filter(x=>x.text);
}

function splitReward(text){
  const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const rewardRe=/^(من قال|من قرأ|كانت له|كان له|حُط|حط|يكتب له|كتبت له|محيت عنه|غُفر|غفر|كُتِب|كتب له|رفع له|يُرفع|أعتقه الله|كفته|أفضل الذكر|كنز من كنوز|تملأ|يأتي شفيعًا|في كل مره|ثقيلتان|غرست له|لفعل الرسول)/;
  let rewardStart=-1;
  for(let j=1;j<lines.length;j++){ if(rewardRe.test(lines[j])) { rewardStart=j; break; } }
  if(rewardStart>-1) return {main:lines.slice(0,rewardStart).join('\n'), reward:lines.slice(rewardStart).join('\n')};
  return {main:text,reward:''};
}
function renderItems(items){
 idx[activeCategory]=Math.min(idx[activeCategory]||0,items.length-1);done[activeCategory]=done[activeCategory]||[];cnt[activeCategory]=cnt[activeCategory]||{};
 const i=idx[activeCategory], item=items[i], current=cnt[activeCategory][i]||0, pct=Math.round((done[activeCategory].length/items.length)*100);
 const parts=splitReward(item.text.replace(/\*\*/g,''));
 const rewardHtml=parts.reward?`<div class="benefit"><div class="benefit-title">${isEnglish()?'Reward':'الفضل / الأجر'}</div><div>${escapeHtml(parts.reward)}</div></div>`:'';
 document.getElementById('content').innerHTML=`<div class="progress"><div class="progress-info"><span>${done[activeCategory].length} / ${items.length} ${isEnglish()?'completed':'مكتملة'}</span><span>${pct}%</span></div><div class="bar"><div style="width:${pct}%"></div></div></div><div class="card"><div class="number">${isEnglish()?'Dhikr':'الذكر'} ${i+1} / ${items.length}</div><div class="text">${escapeHtml(parts.main)}</div>${rewardHtml}<div class="counter"><div class="count">${current}</div><div class="target">${isEnglish()?'Target:':'من'} ${item.count}</div><button class="count-btn" onclick="tap()">${isEnglish()?'Count':'تسبيح'}</button></div><div class="nav"><button class="btn secondary" onclick="prev()">${isEnglish()?'Previous':'السابق'}</button><div class="nav-group"><button class="btn secondary" onclick="resetItem()">${isEnglish()?'Reset':'إعادة العداد'}</button><button class="btn primary" onclick="next()">${isEnglish()?'Next':'التالي'}</button></div></div></div>`;
}
function tap(){const items=parseItems(sourceData[activeCategory]);let i=idx[activeCategory]||0;let cur=(cnt[activeCategory][i]||0)+1;let target=items[i].count;cur=Math.min(cur,target);cnt[activeCategory][i]=cur;if(cur>=target){if(!done[activeCategory].includes(i))done[activeCategory].push(i);if(i<items.length-1)idx[activeCategory]=i+1;else idx[activeCategory]=items.length;}save();renderCategory();}
function next(){const items=parseItems(sourceData[activeCategory]);idx[activeCategory]=Math.min((idx[activeCategory]||0)+1,items.length);save();renderCategory();}
function prev(){idx[activeCategory]=Math.max((idx[activeCategory]||0)-1,0);save();renderCategory();}
function resetItem(){const i=idx[activeCategory]||0;cnt[activeCategory]=cnt[activeCategory]||{};cnt[activeCategory][i]=0;done[activeCategory]=(done[activeCategory]||[]).filter(x=>x!==i);save();renderCategory();}

function renderQuran(){
 document.getElementById('content').innerHTML=`<div class="article"><div class="notice">${isEnglish()?'The Holy Quran — choose a Surah, Juz, or Hizb. Use the arrows to move through Mushaf pages.':'القرآن الكريم — اختر سورة أو جزءًا أو حزبًا، واستخدم الأسهم للتنقل بين صفحات المصحف.'}</div><div class="quran-switch"><button id="qModeSurah" onclick="setQMode('surah')">${isEnglish()?'Surah':'سورة'}</button><button id="qModeJuz" onclick="setQMode('juz')">${isEnglish()?'Juz':'جزء'}</button><button id="qModeHizb" onclick="setQMode('hizb')">${isEnglish()?'Hizb':'حزب'}</button></div><div class="quran-tools" style="grid-template-columns:1fr"><div class="quran-field"><label class="quran-label" id="qChoiceLabel"></label><select id="qNumber"></select></div></div><div class="quran-head"><div id="quranTitle" class="number">${isEnglish()?"Holy Quran":"القرآن الكريم"}</div><div id="quranMeta" class="quran-meta"></div></div><div id="quranView"></div><div class="qpage-bar"><button onclick="qPrev()" aria-label="${isEnglish()?'Previous page':'الصفحة السابقة'}">‹</button><div id="qPageCounter" class="qpage-counter">1 / 604<small>${isEnglish()?"Mushaf page":"صفحة المصحف"}</small></div><button onclick="qNext()" aria-label="${isEnglish()?'Next page':'الصفحة التالية'}">›</button></div></div>`;

function populateQuranSelector(load){
 const sel=document.getElementById('qNumber'); if(!sel)return;
 const mode=window.qMode||'surah';

 const previous=sel.value;
 sel.innerHTML='';
 if(mode==='surah'){
   label.textContent=isEnglish()?'Choose a Surah':'اختر السورة';
   surahNames.forEach((name,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=isEnglish()?`Surah ${i+1} — ${name}`:`${i+1} — ${name}`;sel.appendChild(o)});
   const saved=parseInt(localStorage.getItem('qSurah')||'1');sel.value=String(Math.min(114,Math.max(1,saved)));
 }else if(mode==='juz'){
   label.textContent=isEnglish()?'Choose a Juz':'اختر الجزء';
   for(let i=1;i<=30;i++){const o=document.createElement('option');o.value=i;o.textContent=isEnglish()?`Juz ${i}`:`الجزء ${i}`;sel.appendChild(o)}
   const saved=parseInt(localStorage.getItem('qJuz')||'1');sel.value=String(Math.min(30,Math.max(1,saved)));
 }else{
   label.textContent=isEnglish()?'Choose a Hizb':'اختر الحزب';
   for(let i=1;i<=60;i++){const o=document.createElement('option');o.value=i;o.textContent=isEnglish()?`Hizb ${i}`:`الحزب ${i}`;sel.appendChild(o)}
   const saved=parseInt(localStorage.getItem('qHizb')||'1');sel.value=String(Math.min(60,Math.max(1,saved)));
 }
 document.getElementById('qModeSurah').classList.toggle('active',mode==='surah');
 document.getElementById('qModeJuz').classList.toggle('active',mode==='juz');
 document.getElementById('qModeHizb').classList.toggle('active',mode==='hizb');
 sel.onchange=()=>loadQuranSelection();
 if(load || !previous || mode!==localStorage.getItem('qMode')) loadQuranSelection(); else loadQuranSelection();
}
async function fetchQuranSelection(mode,value){
 if(mode==='surah'){
   const r=await fetch(`https://api.alquran.cloud/v1/surah/${value}/quran-uthmani`);const j=await r.json();
   if(!j.data||!j.data.ayahs)throw new Error('Surah unavailable');
   return {ayahs:j.data.ayahs,startPage:j.data.ayahs[0]?.page||1,label:`${j.data.englishName||j.data.name||''}`};
 }
 if(mode==='juz'){
   const r=await fetch(`https://api.alquran.cloud/v1/juz/${value}/quran-uthmani`);const j=await r.json();
   if(!j.data||!j.data.ayahs)throw new Error('Juz unavailable');
   return {ayahs:j.data.ayahs,startPage:j.data.ayahs[0]?.page||1,label:isEnglish()?`Juz ${value}`:`الجزء ${value}`};
 }
 const quarter=(value-1)*4+1;
 const r=await fetch(`https://api.alquran.cloud/v1/hizbQuarter/${quarter}/quran-uthmani`);const j=await r.json();
 if(!j.data||!j.data.ayahs)throw new Error('Hizb unavailable');
 return {ayahs:j.data.ayahs,startPage:j.data.ayahs[0]?.page||1,label:isEnglish()?`Hizb ${value}`:`الحزب ${value}`};
}
async function loadQuranSelection(){
 const sel=document.getElementById('qNumber');if(!sel)return;
 const mode=window.qMode||'surah', value=parseInt(sel.value)||1;
 localStorage.setItem(mode==='surah'?'qSurah':mode==='juz'?'qJuz':'qHizb',String(value));
 const view=document.getElementById('quranView');view.innerHTML=`<p>${isEnglish()?'Loading…':'جاري التحميل…'}</p>`;
 try{
   const data=await fetchQuranSelection(mode,value);
   window.qSelectionPages=[];
   const byPage=new Map();
   data.ayahs.forEach(a=>{if(!byPage.has(a.page))byPage.set(a.page,[]);byPage.get(a.page).push(a)});
   window.qSelectionPages=[...byPage.keys()].sort((a,b)=>a-b);
   window.qSelectionIndex=0;
   localStorage.setItem('qPage',String(data.startPage));
   await renderQuranPageNumber(data.startPage,data.label);
 }catch(e){view.innerHTML=`<p>${isEnglish()?'Could not load this selection. Check your internet connection and try again.':'تعذر تحميل الاختيار. تأكد من اتصال الإنترنت ثم جرّب مرة أخرى.'}</p>`}
}
async function renderQuranPageNumber(n,metaLabel=''){
 const view=document.getElementById('quranView');if(!view)return;
 view.innerHTML=`<p>${isEnglish()?'Loading page…':'جاري تحميل الصفحة…'}</p>`;
 try{
   const arr=await fetchQuranPage(n);
   const first=arr[0];
   document.getElementById('quranTitle').textContent=metaLabel|| (isEnglish()?`Page ${n}`:`الصفحة ${n}`);
   document.getElementById('quranMeta').textContent=first?(isEnglish()?`${arr[0].surah?.englishName||arr[0].surah?.name||''} • Juz ${first.juz||''}`:`${arr[0].surah?.name||''} • جزء ${first.juz||''}`):'';
   const arabicDigits=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
   const text=arr.map(a=>`${escapeHtml((a.text||'').trim())} <span class="ayah-num">۝${arabicDigits(a.numberInSurah)}</span>`).join(' ');
   view.innerHTML=`<div class="ayah-block"><div class="quran-page-text" id="quranPageText">${text}</div></div>`;
   fitQuranToFourteenLines();
   document.getElementById('qPageCounter').innerHTML=`${n} / 604<small>${isEnglish()?"Mushaf page":"صفحة المصحف"}</small>`;
   localStorage.setItem('qPage',String(n));
 }catch(e){view.innerHTML=`<p>${isEnglish()?'Could not load the page. Check your internet connection and try again.':'تعذر تحميل الصفحة. تأكد من اتصال الإنترنت ثم جرّب مرة أخرى.'}</p>`}
}
async function loadQuran(){ const saved=parseInt(localStorage.getItem('qPage')||'1'); await renderQuranPageNumber(Math.min(604,Math.max(1,saved))); }
