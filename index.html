هُ عَنْهُ أَنَّ النَّبِيَّ قَالَ: **\n\n**مَنْ قَرَأَ سُورَةَ الْكَهْفِ لَيْلَةَ الْجُمُعَةِ أَضَاءَ لَهُ مِنَ النُّورِ فِيمَا بَيْنَهُ وَبَيْنَ الْبَيْتِ الْعَتِيق. [صححه الألباني في صحيح الترغيب والترهيب/736].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الكَهْفِ**\n\n**\\* **\n\n**ألا أخبركم بسورة ملأت عظمتها ما بين السماء و الأرض؟ و لقارئها من الأجر مثل ذلك، و من قرأها غفر له ما بينه و بين الجمعة الأخرى، وزيادة ثلاثة أيام؟ قالوا: بلى قال: سورة الكهف. [ضعيف جداَ/ضعيف الجامع الصغير/ 2160].**\n\n\n\n**\\* **\n\n**سورة الكهف تدعى في التوراة: الحائلة تحول بين قارئها وبين النار. [سلسلة الأحاديث الضعيفة/ 3259].**\n\n\n\n**\\* **\n\n**من قرأ ثلاث آيات من أول الكهف عصم من فتنة الدجال. [ضعيف مشكاة المصابيح/ 2088].**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 4  |   |\n\n---\n\n**فَضْلُ سُورَةِ المُلْكِ**\n\n**الأحاديث الصحيحة التي وردت فى فضل سورة المُلْكِ**\n\n**عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: **\n\n**\"سُورَةٌ مِنَ الْقُرْآنِ ثَلَاثُونَ آيَةً، تَشْفَعُ لِصَاحِبِهَا حَتَّى يُغْفَرَ لَهُ: (تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْك)\". رَوَاه أَبُو دَاوُد (2/ 1400)، والتِّرمِذِي (5/ 2891)، وقَالَ: \"حَدِيثٌ حَسَنٌ\".**\n\n\n\n**عَنْ جَابِرٍ، قَالَ: **\n\n**\"كَانَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ لَا يَنَامُ حَتَّى يَقْرَأَ الم تَنْزِيلُ السَّجْدَةَ، وَتَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ\". [رواه الترمذي وصححه الألباني /2316].**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 5  |   |\n\n---\n\n**فَضْلُ سُورَةِ الكَافِرُون**\n\n**الأحاديث الصحيحة التي وردت فى فضل سورة الكَافِرُون**\n\n**عَنْ نَوْفَلٍ الأَشجَعِيُّ رَضِيَ اللَّهُ عَنْهُ، أَنَّهُ أَتَى النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: **\n\n**يَا رَسُولَ اللَّهِ عَلِّمْنِي شَيْئًا أَقُولُهُ إِذَا أَوَيْتُ إِلَى فِرَاشِي، قَالَ: \"اقْرَأْ: (قُلْ يَا أَيُّهَا الكَافِرُونَ) فَإِنَّهَا بَرَاءَةٌ مِنَ الشِّرْكِ\". رَوَاه أَبُو دَاوُد (4/ 5055)، والتِّرمِذِي (5/ 3403) وصَحَّحَهُ.**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 6  |   |\n\n---\n\n**فَضْلُ سُورَةِ الإِخْلاَصِ**\n\n**الأحاديث الصحيحة التي وردت فى فضل سورة الإِخْلاَصِ**\n\n**عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رَضِيَ اللَّهُ عَنْهُ، قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"أَيَعْجِزُ أَحَدُكُمْ أَنْ يَقْرَأَ كُلَّ لَيْلَةٍ ثُلُثَ الْقُرْآنِ؟\" قَالُوا: وَمَنْ يُطِيقُ ذَلِكَ؟ قَالَ: \"بَلَى؛ (قُلْ هُوَ اللَّهُ أَحَدٌ)\". رَوَاه البُخَارِي (6/ 5015)، ومُسْلِم (1/ 811)، وأَحمَد (14/ 11053).**\n\n\n\n**وعَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللَّهُ عَنْهُ، قَالَ: جَاءَ رَجُلٌ إِلَى رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: **\n\n**إِنِّي أُحِبُّ هَذِهِ السُّورَةَ: (قُلْ هُوَ اللَّهُ أَحَدٌ). فَقَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: \"حُبُّكَ إِيَّاهَا أَدْخَلَكَ الْجَنَّةَ\". رَوَاه البُخَارِي (1/ ص155) تَعلِيقاً، والتِّرمِذِي (5/ 2901) وحَسَّنَهُ.**\n\n\n\n**عن مُعَاذِ بْنِ أَنَسٍ الْجُهَنِيِّ رضي الله عنه عَنْ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: **\n\n**مَنْ قَرَأَ قُلْ هُوَ اللَّهُ أَحَدٌ حَتَّى يَخْتِمَهَا عَشْرَ مَرَّاتٍ بَنَى اللَّهُ لَهُ قَصْرًا فِي الْجَنَّةِ ، فَقَالَ عُمَرُ بْنُ الْخَطَّابِ : إِذَنْ أَسْتَكْثِرَ يَا رَسُولَ اللَّهِ ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ : اللَّهُ أَكْثَرُ وَأَطْيَبُ. رواه أحمد (15057) ، وصححه الألباني في صحيح الجامع (6472).**\n\n\n\n**عَنْ مُعَاذِ بْنِ عَبْدِ اللَّهِ بْنِ خُبَيْبٍ ، عَنْ أَبِيهِ ، قَالَ: **\n\n**خَرَجْنَا فِي لَيْلَةٍ مَطِيرَةٍ ، وَظُلْمَةٍ شَدِيدَةٍ ، نَطْلُبُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُصَلِّي لَنَا ، قَالَ : فَأَدْرَكْتُهُ ، فَقَالَ : قُلْ : فَلَمْ أَقُلْ شَيْئًا ، ثُمَّ قَالَ : قُلْ : فَلَمْ أَقُلْ شَيْئًا ، قَالَ : قُلْ ، فَقُلْتُ : مَا أَقُولُ ؟ قَالَ : قُلْ : \" قُلْ هُوَ اللَّهُ أَحَدٌ , وَالْمُعَوِّذَتَيْنِ حِينَ تُمْسِي وَتُصْبِحُ ثَلَاثَ مَرَّاتٍ تَكْفِيكَ مِنْ كُلِّ شَيْءٍ\". [رواه الترمذي وصححه الألباني /2829].**\n\n\n\n**عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: **\n\n**أَقْبَلْتُ مَعَ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَسَمِعَ رَجُلاً يَقْرَأُ \"قُلْ هُوَ اللَّهُ أَحَدٌ ، اللَّهُ الصَّمَدُ\" ، فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ : وَجَبَتْ قُلْتُ : وَمَا وَجَبَتْ ؟ قَالَ : الْجَنَّةُ. [رواه الترمذي وصحح الألباني /2320].**\n\n\n\n**عَنْ عُقْبَةَ بْنِ عَامِرٍ قَالَ لَقِيتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ لِي: **\n\n**يَا عُقْبَةُ بْنَ عَامِرٍ أَلا أُعَلِّمُكَ سُوَرًا مَا أُنْزِلَتْ فِي التَّوْرَاةِ وَلا فِي الزَّبُورِ و لا فِي الإِنْجِيلِ وَلا فِي الْفُرْقَانِ مِثْلُهُنَّ لا يَأْتِيَنَّ عَلَيْكَ لَيْلَةٌ إِلا قَرَأْتَهُنَّ فِيهَا قُلْ هُوَ اللَّهُ أَحَدٌ وَقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ وَقُلْ أَعُوذُ بِرَبِّ النَّاسِ قَالَ عُقْبَةُ فَمَا أَتَتْ عَلَيَّ لَيْلَةٌ إِلا قَرَأْتُهُنَّ فِيهَا وَحُقَّ لِي أَنْ لا أَدَعَهُنَّ وَقَدْ أَمَرَنِي بِهِنَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. [سلسلة الأحاديث الصحيحة/2861]**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الإِخْلاَصِ**\n\n**\\* **\n\n**\"من قرأ قل هو الله أحد في مرضه الذي يموت فيه، لم يفتن في قبره، وأمن من ضغطة القبر، و حملته الملائكة يوم القيامة بأكفها حتى تجيزه من الصراط إلى الجنة\". (موضوع) [سلسلة الأحاديث الضعيفة/301].**\n\n\n\n**\\* **\n\n**\"من قرأ (قل هو الله أحد) عشرين مرة بنى الله له قصرا في الجنة\". [سلسلة الأحاديث الضعيفة/1351].**\n\n\n\n**\\* **\n\n**\"من قرأ {قل هو الله أحد} مائتي مرة، غفرت له ذنوب مائتي سنة\". [سلسلة الأحاديث الضعيفة/295].**\n\n\n\n**\\* **\n\n**\"من قرأ قل هو الله أحد مائتي مرة كتب الله له ألفا و خمسمائة حسنة، إلا أن يكون عليه دين\". [سلسلة الأحاديث الضعيفة/300].**\n\n\n\n**\\* **\n\n**\"من مر بالمقابر فقرأ (قل هو الله أحد) إحدى عشرة مرة، ثم وهب أجره للأموات، أعطي من الأجر بعدد الأموات\". [سلسلة الأحاديث الضعيفة/1290].**\n\n\n\n**\\* **\n\n**\"من صلى الصبح ثم قرأ (قل هو الله أحد) مائة مرة قبل أن يتكلم، فكلما قرأ (قل هو الله أحد) غفر له ذنب سنة\". [سلسلة الأحاديث الضعيفة/405].**\n\n\n\n**\\* **\n\n**\"من مر على المقابر فقرأ فيها إحدى عشرة مرة: {قل هو الله أحد} ثم وهب أجره للأموات أعطي من الأجر بعدد الأموات\". [سلسلة الأحاديث الضعيفة /3277].**\n\n\n\n**\\* **\n\n**\"من قرأ بعد صلاة الجمعة {قل هو الله أحد} و{قل أعوذ برب الفلق} و{قل أعوذ برب الناس} سبع مرات أجاره الله بها من السوء إلى الجمعة الأخرى\". [سلسلة الأحاديث الضعيفة /4129].**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 7  |   |\n\n---\n\n**فَضْلُ سُورَةِ الفَلَقِ والنَّاسِ (المعوذتين)**\n\n**الأحاديث الصحيحة التي وردت فى فضل سورة الفَلَقِ والنَّاسِ (المعوذتين)**\n\n**عَنْ عُقْبَةَ بْنِ عَامِرٍ الجُهَنِيِّ رَضِيَ اللَّهُ عَنْهُ، قَالَ: قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"أَلَمْ تَرَ آيَاتٍ أُنْزِلَتِ اللَّيْلَةَ لَمْ يُرَ مِثْلُهُنَّ قَطُّ: (قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ) وَ (قُلْ أَعُوذُ بِرَبِّ النَّاسِ)\". رَوَاه مُسْلِم (1/ 814)، وأَبُو دَاوُد (2/ 1462).**\n\n\n\n**وعَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ: قَالَ لِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"اقْرَأْ يَا جَابِرُ\". قُلْتُ: وَمَا أَقْرَأُ بِأَبِي أَنْتَ وَأُمِّي؟ قَالَ: \"اقْـــرَأْ: (قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ) وَ (قُلْ أَعُوذُ بِرَبِّ النَّاسِ). فَقَرَأْتُهُمَا، فَقَالَ: «اقْرَأْ بِهِمَا، وَلَنْ تَقْرَأَ بِمِثْلِهِمَا\". رَوَاه النَّسَائِيُّ (8/ 5441)، وابْنُ حِبَّان (3/ 796). وهو حَدِيث حَسَن.**\n\n\n\n**عَنْ عُقْبَةَ بْنِ عَامِرٍ قَالَ لَقِيتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ لِي: **\n\n**يَا عُقْبَةُ بْنَ عَامِرٍ أَلا أُعَلِّمُكَ سُوَرًا مَا أُنْزِلَتْ فِي التَّوْرَاةِ وَلا فِي الزَّبُورِ و لا فِي الإِنْجِيلِ وَلا فِي الْفُرْقَانِ مِثْلُهُنَّ لا يَأْتِيَنَّ عَلَيْكَ لَيْلَةٌ إِلا قَرَأْتَهُنَّ فِيهَا قُلْ هُوَ اللَّهُ أَحَدٌ وَقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ وَقُلْ أَعُوذُ بِرَبِّ النَّاسِ قَالَ عُقْبَةُ فَمَا أَتَتْ عَلَيَّ لَيْلَةٌ إِلا قَرَأْتُهُنَّ فِيهَا وَحُقَّ لِي أَنْ لا أَدَعَهُنَّ وَقَدْ أَمَرَنِي بِهِنَّ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ. [سلسلة الأحاديث الصحيحة/2861]**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الفَلَقِ والنَّاسِ (المعوذتين)**\n\n**\\* **\n\n**\"من قرأ بعد صلاة الجمعة {قل هو الله أحد} و{قل أعوذ برب الفلق} و{قل أعوذ برب الناس} سبع مرات أجاره الله بها من السوء إلى الجمعة الأخرى\". [سلسلة الأحاديث الضعيفة /4129].**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 8  |   |\n\n---\n\n**فَضْلُ سُورَةِ هود**\n\n**الأحاديث الصحيحة التي وردت فى فضل سورة هود**\n\n**عَنْ ابْنِ عَبَّاسٍ، قَالَ: قَالَ أَبُو بَكْرٍ: يَا رَسُولَ اللَّهِ قَدْ شِبْتَ، قَالَ: **\n\n**\"شَيَّبَتْنِي هُودٌ، وَالوَاقِعَةُ، وَالمُرْسَلَاتُ، وَعَمَّ يَتَسَاءَلُونَ، وَإِذَا الشَّمْسُ كُوِّرَتْ\". [رواه الترمذي وصححه الألباني في صحيح الجامع / 3723].**\n\n\n\n**قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"شيبتني هود وأخواتها قبل المشيب\". [صحيح الجامع الصغير/3721].**\n\n\n\n**قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"شيبتني هود وأخواتها من المفصل\". [صحيح الجامع الصغير/3722].**\n\n\n\n**قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"قد شيبتي هود وأخواتها\". [صحيح الشمائل المحمدية/35].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة هود**\n\n**\\* **\n\n**\"شيبتني (هود) وأخواتها، وما فعل بالأمم قبلي\". [ضعيف الجامع الصغير/3421].**\n\n\n\n**\\* **\n\n**\"اقرؤوا سورة هود يوم الجمعة\". [ضعيف الجامع الصغير/1070].**\n\n\n\n**\\* **\n\n**\"شيبتني (هود) وأخواتها، (الواقعة) و(الحاقة) و(إذا الشمس كورت)\". [ضعيف الجامع الصغير/ 3419].**\n\n\n\n**\\* **\n\n**\"شيبتني سورة هود وأخواتها الواقعة والقارعة والحاقة وإذا الشمس كورت وسأل سائل\". [ضعيف الجامع الصغير/3418].**\n\n\n\n**\\* **\n\n**\"شيبتني (هود) وأخواتها: ذكر يوم القيامة ، و قصص الأمم\". [ضعيف الجامع الصغير/3420].**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 9  |   |\n\n---\n\n**فَضْلُ سُورَةِ الإسراء**\n\n**الأحاديث الصحيحة التي وردت فى فضل سورة الإسراء**\n\n**عن عَائِشَة رضي الله عنها قالت: **\n\n**\"كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ لَا يَنَامُ حَتَّى يَقْرَأَ الزُّمَرَ ، وَبَنِي إِسْرَائِيلَ\". [سلسلة الأحاديث الصحيحة/641].**\n\n\n\n**عَنِ الْعِرْبَاضِ بْنِ سَارِيَةَ رَضِيَ اللَّهُ عَنْهُ ، أَنَّ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"كَانَ لَا يَنَامُ حَتَّى يَقْرَأَ الْمُسَبِّحَاتِ ، وَيَقُولُ فِيهَا آيَةٌ خَيْرٌ مِنْ أَلْفِ آيَةٍ\". [رواه الترمذي وصححه الألباني /2712].**\n**المسبحات: هي السور التي تفتتح بقوله تعالى \"سبح\" أو \"يسبح\" وهن سور الإسراء، الحديد، الحشر، الصف، الجمعة ، التغابن، والأعلى.**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 10 |   |\n\n---\n\n**فَضْلُ سُورَةِ الفتح**\n\n**الأحاديث الصحيحة التي وردت فى فضل سورة الفتح**\n\n**عَنْ ‏ ‏أَنَسٍ **\n\n**أَنَّهَا نَزَلَتْ عَلَى النَّبِيِّ ‏ ‏صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ‏ ‏مَرْجِعَهُ مِنْ ‏ ‏الْحُدَيْبِيَةِ ‏ ‏وَأَصْحَابُهُ يُخَالِطُونَ الْحُزْنَ وَالْكَآبَةَ وَقَدْ حِيلَ بَيْنَهُمْ وَبَيْنَ مَسَاكِنِهِمْ وَنَحَرُوا ‏ ‏الْهَدْيَ ‏ ‏بِالْحُدَيْبِيَةِ ‏ ( إِنَّا فَتَحْنَا لَكَ فَتْحًا مُبِينًا ‏ ‏إِلَى قَوْلِهِ ( ‏ ‏صِرَاطًا مُسْتَقِيمًا ‏ ) ‏قَالَ : لَقَدْ ‏ ‏أُنْزِلَتْ عَلَيَّ آيَتَانِ هُمَا أَحَبُّ إِلَيَّ مِنْ الدُّنْيَا جَمِيعًا ) [ رواه أحمد وصححه الألباني في صحيح الجامع / 5121].**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 11 |   |\n\n---\n\n**الأحاديث الضعيفة التي وردت في فضائل بعض السور**\n\n**هام جداً: تم وضع الأحاديث الضعيفة هنا لكي لايؤخذ بها و يعلم الناس أنها ضعيفة.**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة يس**\n\n**جميع الروايات الواردة بفضل سورة (يس) ضعيفة أو موضوعة.**\n\n\n\n**\\* **\n\n**(إن الله تبارك وتعالى قرأ (طه) و(يّس) قبل أن يخلق آدم بألفي عام، فلما سمعت الملائكة القرآن قالوا: طوبى لأمة ينزل هذا عليهم، وطوبى لألسن تتكلم بهذا، وطوبى لأجوف تحمل هذا)[سلسلة الأحاديث الضعيفة/ 1248].**\n\n\n\n**\\* **\n\n**(من دخل المقابر فقرأ سورة (يّس) خفف عنهم يومئذ، وكان له بعدد من فيها حسنات)[((موضوع))/سلسلة الأحاديث الضعيفة/1246].**\n\n\n\n**\\* **\n\n**(إن لكل شيء قلبا، وقلب القرآن (يس)، ومن قرأ (يس) كتب الله له بقراءتها قراءة القرآن عشر مرات)[((موضوع))/ضعيف الترغيب و الترهيب/885].**\n\n\n\n**\\* **\n\n**من قرأ (يس) ابتغاء وجه الله، غفر الله له ما تقدم من ذنبه، فاقرؤوها عند موتاكم)((ضعيف))[ضعيف الجامع الصغير/5785].**\n\n\n\n**\\* **\n\n**(من قرأ {يس} في صدر النها قضيت حوائجه)[((ضعيف))/ضعيف مشكاة المصابيح/2118].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الدخان**\n\n**\\* **\n\n**(من قرأ سورة الدخان في ليلة الجمعة غفر له). [((ضعيف جدا)). سلسلة الأحاديث الضعيفة/4632].**\n\n\n\n**\\* **\n\n**(من قرأ سورة {الدخان} في ليلة أصبح يستغفر له سبعون ألف ملك). [((موضوع))/ضعيف الترغيب و الترهيب/978].**\n\n\n\n**\\* **\n\n**(من صلى بسورة الدخان في ليلة بات يستغفر له سبعون ألف ملك). [ضعيف الترغيب والترهيب/448].**\n\n\n\n**\\* **\n\n**(من قرأ {حم الدخان} في ليله الجمعة أو يوم الجمعة بنى الله له بها بيتا في الجن ة). [((ضعيف جدا))/ضعيف الترغيب والترهيب/449].**\n\n\n\n**\\* **\n\n**(من قرأ سورة يس في ليلة أصبح مغفورا له. ومن قرأ الدخان ليلة الجمعة أصبح مغفورا له). [ضعيف الترغيب و الترهيب/978].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة غافر**\n\n**\\* **\n\n**(من قرأ {الدخان}كلها، وأول {حم غافر} إلى {وإليه المصير}، و{آية الكرسي} حين يمسي حفظ بها حتى يصبح، ومن قرأها حين يصبح، حفظ بها حتى يمسي). [((ضعيف))/ضعيف الترغيب والترهيب/390].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الحشر**\n\n**\\* **\n\n**(من قال حين يصبح ثلاث مرات: أعوذ بالله السميع العليم، من الشيطان الرجيم، و قرأ ثلاث آيات من آخر سورة (الحشر)، وكل الله به سبعين ألف ملك، يصلون عليه حين يمسي، و إن مات في ذلك اليوم، مات شهيدا، و من قالها حين يمسي كان بتلك المنزلة). [((ضعيف))/ضعيف الجامع الصغير/5732].**\n\n\n\n**\\* **\n\n**(من قرأ خواتيم (الحشر) من ليل أو نهار، فقبض في ذلك اليوم أو الليلة فقد أوجب الجن ة). [((ضعيف))/ضعيف الجامع الصغير/5770].**\n\n\n\n**\\* **\n\n**(اسم الله الأعظم في ست آيات من آخر سورة الحشر). [ضعيف الجامع الصغير/ 853].**\n\n\n\n**\\* **\n\n**(إذا أخذت مضجعك فاقرأ سورة الحشر، إن مت مت شهيدا). [ضعيف الجامع الصغير/307].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الرحمن**\n\n**\\* **\n\n**(لكل شىء عروس، وعروس القرآن الرحمن). [((ضعيف))/ضعيف الجامع الصغير/ 4729].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الواقعة**\n\n**\\* **\n\n**(علموا نساءكم سورة {الواقعة}، فإنها سورة الغنى). [ضعيف الجامع الصغير/3730].**\n\n\n\n**\\* **\n\n**(من قرأ سورة (الواقعة و تعلمها، لم يكتب من الغافلين، و لم يفتقر هو و أهل بيته). [سلسلة الأحاديث الضعيفة/291].**\n\n\n\n**\\* **\n\n**(من قرأ سورة (الواقعة) في كل ليلة، لم تصبه فاقة أبدا). [((ضعيف))/ضعيف الجامع الصغير/5773].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الزلزلة**\n\n**\\* **\n\n**(إذا زلزلت تعدل نصف القرآن). [((ضعيف))/ضعيف الترغيب و الترهيب/889].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة الشرح وســورة الفيل**\n\n**\\* **\n\n**(من قرأ في الفجر بـ (ألم نشرح) و (ألم تر كيف) لم يرمد)[(((لا أصل له)))/سلسلة الأحاديث الضعيفة/67].**\n\n**الأحاديث الضعيفة التي وردت فى فضل سورة القدر**\n\n**\\* **\n\n**(قراءة (سورة إنا أنزلناه) عقب الوضوء ). [سلسلة الأحاديث الضعيفة/68].**\n\n\n\n**\\* **\n\n**(من قرأ في إثر وضوئه: {إنا أنزلناه في ليلة القدر } مرة واحدة كان من الصديقين، و ن قرأها مرتين كتب في ديوان الشهداء ، ومن قرأها ثلاثا حشره الله محشر الأنبياء). [سلسلة الأحاديث الضعيفة/1449].**", "فضل القرآن": "**فضائل القرآن**\n\n**فضائل القرآن الكريم**\n\n**أن **\n\n**أهل القرآن هم أهل الله.**\n\n\n\n**أن **\n\n**ثواب تلاوة القرآن أعظم من أنفس أموال الدنيا.**\n\n\n\n**أن **\n\n**كل حرف فيه بعشر حسنات.**\n\n\n\n**أنه **\n\n**يورث الإنسان الراحة والذكر الحسن في السماء والأرض.**\n\n\n\n**أن **\n\n**كل آية يحفظها المسلم يرفعه الله بها درجة في الجنة.**\n\n\n\n**أن **\n\n**الماهر بالقرآن يقرنه الله تعالى بأفضل الملائكة.**\n\n\n\n**أن **\n\n**أفضل الناس هو من يتعلم القرآن ويعلمه.**\n\n\n\n**أن **\n\n**الله تعالى لا يعذب إنسانًا حفظ القرآن وعمل به.**\n\n\n\n**أنه **\n\n**يأتي شفيعًا لأصحابه الذين كانوا يعملون به في الدنيا.**\n\n\n\n**أن **\n\n**صاحب القرآن رفعه النبي صلى الله عليه وسلم صلى الله عليه وسلم إلى مراتب العلماء.**\n\n\n\n**أن **\n\n**صاحب القرآن يكرمه الله عز وجل عليه وعلى والديه يوم القيامة بأنواع عظيمة من التكريم.**\n\n\n\n**أن **\n\n**القرآن هو من أعظم القربات التي يتقرب بها إلى الله وأحبها إليه.**\n\n\n\n**أن **\n\n**الخلق كلهم يكتبون في كل ليلة من الغافلين إلا من قرأ القرآن.**\n\n\n\n**أن **\n\n**البيت الذي يقرأ فيه القرآن تحصل فيه الخيرات والبركات ويحفظ الله تعالى أهل هذا البيت من كل سوء.**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 1  |   |\n\n---\n\n**آيات تدعو لتلاوة القرآن الكريم وتدبره والتأثر به**\n\n**قال تعالى : **\n\n**\"وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنصِتُوا لَعَلَّكُمْ تُرْحَمُونَ\". [الأعراف - 204].**\n\n\n\n**وقال تعالى : **\n\n**\"وَنُنَزِّلُ مِنْ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلا يَزِيدُ الظَّالِمِينَ إِلاَّ خَسَاراً\". [الإسراء - 82].**\n\n\n\n\n**قال تعالى : **\n\n**\"إِنَّ هَذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْراً كَبِيراً\". [الإسراء - 9]**\n\n\n\n**وقال تعالى : **\n\n**\"كِتَابٌ أَنزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِيَدَّبَّرُوا آيَاتِهِ وَلِيَتَذَكَّرَ أُوْلُوا الأَلْبَابِ\". [ص - 29].**\n\n\n\n**وقال تعالى : **\n\n**\"وَرَتِّلْ الْقُرْآنَ تَرْتِيلاً\". [المزمل - 4]**\n\n\n\n**وقال تعالى : **\n\n**\"وَلَوْ أَنَّ قُرْآناً سُيِّرَتْ بِهِ الْجِبَالُ أَوْ قُطِّعَتْ بِهِ الأَرْضُ أَوْ كُلِّمَ بِهِ الْمَوْتَى بَلْ لِلَّهِ الأَمْرُ جَمِيعاً أَفَلَمْ يَيْئَسْ الَّذِينَ آمَنُوا أَنْ لَوْ يَشَاءُ اللَّهُ لَهَدَى النَّاسَ جَمِيعاً وَلا يَزَالُ الَّذِينَ كَفَرُوا تُصِيبُهُمْ بِمَا صَنَعُوا قَارِعَةٌ أَوْ تَحُلُّ قَرِيباً مِنْ دَارِهِمْ حَتَّى يَأْتِيَ وَعْدُ اللَّهِ إِنَّ اللَّهَ لا يُخْلِفُ الْمِيعَادَ\". [الرعد - 31].**\n\n\n\n**وقال تعالى : **\n\n**\" وَقَالَ الرَّسُولُ يَا رَبِّ إِنَّ قَوْمِي اتَّخَذُوا هَذَا الْقُرْآنَ مَهْجُوراً\". [الفرقان - 30].**\n\n\n\n**وقال تعالى : **\n\n**\"أَفَلا يَتَدَبَّرُونَ الْقُرْآنَ وَلَوْ كَانَ مِنْ عِنْدِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلافاً كَثِيراً\". [النساء - 82].**\n\n\n\n**وقال تعالى : **\n\n**\"قُلْ أَيُّ شَيْءٍ أَكْبَرُ شَهَادَةً قُلْ اللَّهُ شَهِيدٌ بَيْنِي وَبَيْنَكُمْ وَأُوحِيَ إِلَيَّ هَذَا الْقُرْآنُ لأُنذِرَكُمْ بِهِ وَمَنْ بَلَغَ أَئِنَّكُمْ لَتَشْهَدُونَ أَنَّ مَعَ اللَّهِ آلِهَةً أُخْرَى قُلْ لا أَشْهَدُ قُلْ إِنَّمَا هُوَ إِلَهٌ وَاحِدٌ وَإِنَّنِي بَرِيءٌ مِمَّا تُشْرِكُونَ \". [الأنعام - 19].**\n\n\n\n**وقال تعالى : **\n\n**\"وَمَا كَانَ هَذَا الْقُرْآنُ أَنْ يُفْتَرَى مِنْ دُونِ اللَّهِ وَلَكِنْ تَصْدِيقَ الَّذِي بَيْنَ يَدَيْهِ وَتَفْصِيلَ الْكِتَابِ لا رَيْبَ فِيهِ مِنْ رَبِّ الْعَالَمِينَ \". [يونس - 37].**\n\n\n\n**وقال تعالى : **\n\n**\"وَلَقَدْ آتَيْنَاكَ سَبْعاً مِنْ الْمَثَانِي وَالْقُرْآنَ الْعَظِيمَ\". [الحجر - 87].**\n\n\n\n**وقال تعالى : **\n\n**\" الَّذِينَ جَعَلُوا الْقُرْآنَ عِضِينَ\". [الحجر - 91].**\n\n\n\n**وقال تعالى : **\n\n**\"فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنْ الشَّيْطَانِ الرَّجِيمِ\". [النحل - 98].**\n\n\n\n**وقال تعالى : **\n\n**\"وَلَقَدْ صَرَّفْنَا فِي هَذَا الْقُرْآنِ لِيَذَّكَّرُوا وَمَا يَزِيدُهُمْ إِلاَّ نُفُوراً\". [الإسراء - 41].**\n\n\n\n**وقال تعالى : **\n\n**\"وَجَعَلْنَا عَلَى قُلُوبِهِمْ أَكِنَّةً أَنْ يَفْقَهُوهُ وَفِي آذَانِهِمْ وَقْراً وَإِذَا ذَكَرْتَ رَبَّكَ فِي الْقُرْآنِ وَحْدَهُ وَلَّوْا عَلَى أَدْبَارِهِمْ نُفُوراً\". [الإسراء - 46].**\n\n\n\n**وقال تعالى : **\n\n**\"وَإِذَا قَرَأْتَ الْقُرْآنَ جَعَلْنَا بَيْنَكَ وَبَيْنَ الَّذِينَ لا يُؤْمِنُونَ بِالآخِرَةِ حِجَاباً مَسْتُوراً\". [الإسراء - 45].**\n\n\n\n**وقال تعالى : **\n\n**\"قُلْ لَئِنْ اجْتَمَعَتْ الإِنسُ وَالْجِنُّ عَلَى أَنْ يَأْتُوا بِمِثْلِ هَذَا الْقُرْآنِ لا يَأْتُونَ بِمِثْلِهِ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٍ ظَهِيراً\". [الإسراء - 88].**\n\n\n\n**وقال تعالى : **\n\n**\"وَلَقَدْ صَرَّفْنَا فِي هَذَا الْقُرْآنِ لِلنَّاسِ مِنْ كُلِّ مَثَلٍ وَكَانَ الإِنسَانُ أَكْثَرَ شَيْءٍ جَدَلاً\". [الكهف - 54].**\n\n\n\n**وقال تعالى : **\n\n**\"طه (1) مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَى (2) إِلاَّ تَذْكِرَةً لِمَنْ يَخْشَى (3) تَنزِيلاً مِمَّنْ خَلَقَ الأَرْضَ وَالسَّمَوَاتِ الْعُلا (4) الرَّحْمَنُ عَلَى الْعَرْشِ اسْتَوَى \". [طه 1-5].**\n\n\n\n**وقال تعالى : **\n\n**\"إِنَّ هَذَا الْقُرْآنَ يَقُصُّ عَلَى بَنِي إِسْرَائِيلَ أَكْثَرَ الَّذِي هُمْ فِيهِ يَخْتَلِفُونَ (76) وَإِنَّهُ لَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ (77)\". [النمل 76-77].**\n\n\n\n**وقال تعالى : **\n\n**\"إِنَّمَا أُمِرْتُ أَنْ أَعْبُدَ رَبَّ هَذِهِ الْبَلْدَةِ الَّذِي حَرَّمَهَا وَلَهُ كُلُّ شَيْءٍ وَأُمِرْتُ أَنْ أَكُونَ مِنْ الْمُسْلِمِينَ (91) وَأَنْ أَتْلُوَ الْقُرْآنَ فَمَنْ اهْتَدَى فَإِنَّمَا يَهْتَدِي لِنَفْسِهِ وَمَنْ ضَلَّ فَقُلْ إِنَّمَا أَنَا مِنْ الْمُنذِرِينَ (92)\". [النمل 91-92].**\n\n\n\n**وقال تعالى : **\n\n**\"وَلَقَدْ ضَرَبْنَا لِلنَّاسِ فِي هَذَا الْقُرْآنِ مِنْ كُلِّ مَثَلٍ وَلَئِنْ جِئْتَهُمْ بِآيَةٍ لَيَقُولَنَّ الَّذِينَ كَفَرُوا إِنْ أَنْتُمْ إِلاَّ مُبْطِلُونَ (58)\". [الروم - 58].**\n\n\n\n**وقال تعالى : **\n\n**\"قُلْ أُوحِيَ إِلَيَّ أَنَّهُ اسْتَمَعَ نَفَرٌ مِنْ الْجِنِّ فَقَالُوا إِنَّا سَمِعْنَا قُرْآناً عَجَباً (1) يَهْدِي إِلَى الرُّشْدِ فَآمَنَّا بِهِ وَلَنْ نُشْرِكَ بِرَبِّنَا أَحَداً (2)\". [الجن 1-2].**\n\n\n\n**وقال تعالى : **\n\n**\"وَقَالَ الَّذِينَ كَفَرُوا لا تَسْمَعُوا لِهَذَا الْقُرْآنِ وَالْغَوْا فِيهِ لَعَلَّكُمْ تَغْلِبُونَ \". [فصلت - 26].**\n\n\n\n**وقال تعالى : **\n\n**\"شَهْرُ رَمَضَانَ الَّذِي أُنزِلَ فِيهِ الْقُرْآنُ هُدًى لِلنَّاسِ وَبَيِّنَاتٍ مِنْ الْهُدَى وَالْفُرْقَانِ فَمَنْ شَهِدَ مِنْكُمْ الشَّهْرَ فَلْيَصُمْهُ وَمَنْ كَانَ مَرِيضاً أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ يُرِيدُ اللَّهُ بِكُمْ الْيُسْرَ وَلا يُرِيدُ بِكُمْ الْعُسْرَ وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللَّهَ عَلَى مَا هَدَاكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ \". [البقرة - 185].**\n\n\n\n**وقال تعالى : **\n\n**\"لَوْ أَنْزَلْنَا هَذَا الْقُرْآنَ عَلَى جَبَلٍ لَرَأَيْتَهُ خَاشِعاً مُتَصَدِّعاً مِنْ خَشْيَةِ اللَّهِ وَتِلْكَ الأَمْثَالُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَ\". [الحشر - 21].**\n\n\n\n**وقال تعالى : **\n\n**\"حم (1) وَالْكِتَابِ الْمُبِينِ (2) إِنَّا أَنزَلْنَاهُ فِي لَيْلَةٍ مُبَارَكَةٍ إِنَّا كُنَّا مُنذِرِينَ (3)\". [الدخان 1-3].**\n\n\n\n**وقال تعالى : **\n\n**\"إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ (1) وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ (2) لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ (3) تَنَزَّلُ الْمَلائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِمْ مِنْ كُلِّ أَمْرٍ (4) سَلامٌ هِيَ حَتَّى مَطْلَعِ الْفَجْرِ (5)\". [القدر 1-5].**\n\n\n\n**وقال تعالى : **\n\n**\"وَقَالَ الَّذِينَ كَفَرُوا لَوْلا نُزِّلَ عَلَيْهِ الْقُرْآنُ جُمْلَةً وَاحِدَةً كَذَلِكَ لِنُثَبِّتَ بِهِ فُؤَادَكَ وَرَتَّلْنَاهُ تَرْتِيلاً\". [الفرقان - 32].**\n\n\n\n**وقال تعالى : **\n\n**\"وَإِذْ صَرَفْنَا إِلَيْكَ نَفَراً مِنْ الْجِنِّ يَسْتَمِعُونَ الْقُرْآنَ فَلَمَّا حَضَرُوهُ قَالُوا أَنْصِتُوا فَلَمَّا قُضِيَ وَلَّوْا إِلَى قَوْمِهِمْ مُنْذِرِينَ (29) قَالُوا يَا قَوْمَنَا إِنَّا سَمِعْنَا كِتَاباً أُنْزِلَ مِنْ بَعْدِ مُوسَى مُصَدِّقاً لِمَا بَيْنَ يَدَيْهِ يَهْدِي إِلَى الْحَقِّ وَإِلَى طَرِيقٍ مُسْتَقِيمٍ (30)\". [الأحقاف 29-30].**\n\n\n\n**وقال تعالى : **\n\n**\"وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِنْ مُدَّكِرٍ\". [القمر - 17].**\n\n\n\n**وقال تعالى : **\n\n**\"وَهَذَا ذِكْرٌ مُبَارَكٌ أَنزَلْنَاهُ أَفَأَنْتُمْ لَهُ مُنكِرُونَ\". [الأنبياء - 50].**\n\n\n\n**وقال تعالى : **\n\n**\"وَمَا عَلَّمْنَاهُ الشِّعْرَ وَمَا يَنْبَغِي لَهُ إِنْ هُوَ إِلاَّ ذِكْرٌ وَقُرْآنٌ مُبِينٌ (69) لِيُنْذِرَ مَنْ كَانَ حَيّاً وَيَحِقَّ الْقَوْلُ عَلَى الْكَافِرِينَ (70)\". [يس 69-70].**\n\n\n\n**وقال تعالى : **\n\n**\"اللَّهُ نَزَّلَ أَحْسَنَ الْحَدِيثِ كِتَاباً مُتَشَابِهاً مَثَانِيَ تَقْشَعِرُّ مِنْهُ جُلُودُ الَّذِينَ يَخْشَوْنَ رَبَّهُمْ ثُمَّ تَلِينُ جُلُودُهُمْ وَقُلُوبُهُمْ إِلَى ذِكْرِ اللَّهِ ذَلِكَ هُدَى اللَّهِ يَهْدِي بِهِ مَنْ يَشَاءُ وَمَنْ يُضْلِلْ اللَّهُ فَمَا لَهُ مِنْ هَادٍ\". [الزمر - 23].**\n\n\n\n**وقال تعالى : **\n\n**\"وَهَذَا كِتَابٌ أَنزَلْنَاهُ مُبَارَكٌ مُصَدِّقُ الَّذِي بَيْنَ يَدَيْهِ وَلِتُنذِرَ أُمَّ الْقُرَى وَمَنْ حَوْلَهَا وَالَّذِينَ يُؤْمِنُونَ بِالآخِرَةِ يُؤْمِنُونَ بِهِ وَهُمْ عَلَى صَلاتِهِمْ يُحَافِظُونَ\". [الأنعام - 92].**\n\n\n\n**وقال تعالى : **\n\n**\"وَقَالَ الَّذِينَ كَفَرُوا لَنْ نُؤْمِنَ بِهَذَا الْقُرْآنِ وَلا بِالَّذِي بَيْنَ يَدَيْهِ وَلَوْ تَرَى إِذْ الظَّالِمُونَ مَوْقُوفُونَ عِنْدَ رَبِّهِمْ يَرْجِعُ بَعْضُهُمْ إِلَى بَعْضٍ الْقَوْلَ يَقُولُ الَّذِينَ اسْتُضْعِفُوا لِلَّذِينَ اسْتَكْبَرُوا لَوْلا أَنْتُمْ لَكُنَّا مُؤْمِنِينَ\". [سبأ - 31].**\n\n\n\n**وقال تعالى : **\n\n**\"لَقَدْ أَنزَلْنَا إِلَيْكُمْ كِتَاباً فِيهِ ذِكْرُكُمْ أَفَلا تَعْقِلُونَ\". [الأنبياء - 10].**\n\n\n\n**وقال تعالى : **\n\n**\"الر تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ (1) إِنَّا أَنزَلْنَاهُ قُرْآناً عَرَبِيّاً لَعَلَّكُمْ تَعْقِلُونَ (2)\". [يوسف 1-2].**\n\n\n\n**وقال تعالى : **\n\n**\"الر كِتَابٌ أُحْكِمَتْ آيَاتُهُ ثُمَّ فُصِّلَتْ مِنْ لَدُنْ حَكِيمٍ خَبِيرٍ\". [هود - 1].**\n\n\n\n**وقال تعالى : **\n\n**\"الَّذِينَ آتَيْنَاهُمْ الْكِتَابَ يَتْلُونَهُ حَقَّ تِلاوَتِهِ أُوْلَئِكَ يُؤْمِنُونَ بِهِ وَمَنْ يَكْفُرْ بِهِ فَأُوْلَئِكَ هُمْ الْخَاسِرُونَ\". [البقرة - 121].**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 2  |   |\n\n---\n\n**أحاديث تدعو لتلاوة القرآن الكريم وتدبره والتأثر به**\n\n**قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"إِنَّ اللَّهَ يَرْفَعُ بِهَذَا الْكِتَابِ أَقْوَامًا وَيَضَعُ بِهِ آخَرِينَ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"الْمُؤْمِنُ الَّذِي يَقْرَأُ الْقُرْآنَ وَيَعْمَلُ بِهِ كَالأُتْرُجَّةِ طَعْمُهَا طَيِّبٌ وَرِيحُهَا طَيِّبٌ وَالْمُؤْمِنُ الَّذِي لَا يَقْرَأُ الْقُرْآنَ وَيَعْمَلُ بِهِ كَالتَّمْرَةِ طَعْمُهَا طَيِّبٌ وَلا رِيحَ لَهَا وَمَثَلُ الْمُنَافِقِ الَّذِي يَقْرَأُ الْقُرْآنَ كَالرَّيْحَانَةِ رِيحُهَا طَيِّبٌ وَطَعْمُهَا مُرٌّ وَمَثَلُ الْمُنَافِقِ الَّذِي لا يَقْرَأُ الْقُرْآنَ كَالْحَنْظَلَةِ طَعْمُهَا مُرٌّ أَوْ خَبِيثٌ وَرِيحُهَا مُرٌّ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"مَثَلُ الَّذِي يَقْرَأُ الْقُرْآنَ وَهُوَ حَافِظٌ لَهُ مَعَ السَّفَرَةِ الْكِرَامِ الْبَرَرَةِ وَمَثَلُ الَّذِي يَقْرَأُ وَهُوَ يَتَعَاهَدُهُ وَهُوَ عَلَيْهِ شَدِيدٌ فَلَهُ أَجْرَانِ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"كِتَابُ اللَّهِ ، هُوَ حَبْلُ اللَّهِ الْمَمْدُودُ مِنَ السَّمَاءِ إِلَى الأَرْضِ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"مَنْ قَرَأَ حرفًا مِن كتابِ اللهِ، فلَهُ به حسنة، والحَسَنةُ بعشْرِ أمثالِها، لا أقول ألم حرف؛ ولكن ألف حرف، ولام حَرْف، ومِيم حَرْف\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"لا أُلْفِيَنَّ أَحَدَكُمْ مُتَّكِئًا عَلَى أَرِيكَتِهِ يَأْتِيهِ الأَمْرُ مِنْ أَمْرِي مِمَّا أَمَرْتُ بِهِ أَوْ نَهَيْتُ عَنْهُ ، فَيَقُولُ : مَا أَدْرِي مَا وَجَدْنَا فِي كِتَابِ اللَّهِ اتَّبَعْنَاهُ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"لا حَسَدَ إِلا فِي اثْنَتَيْنِ رَجُلٌ آتَاهُ اللَّهُ مَالا فَسُلِّطَ عَلَى هَلَكَتِهِ فِي الْحَقِّ وَرَجُلٌ آتَاهُ اللَّهُ الْحِكْمَةَ فَهُوَ يَقْضِي بِهَا وَيُعَلِّمُهَا\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"إِنَّ اللَّهَ يَأْمُرُكَ أَنْ تَقْرَأَ أُمَّتُكَ الْقُرْآنَ عَلَى سَبْعَةِ أَحْرُفٍ فَأَيُّمَا حَرْفٍ قَرَءُوا عَلَيْهِ فَقَدْ أَصَابُوا\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَجْمَعُ بَيْنَ الرَّجُلَيْنِ مِنْ قَتْلَى أُحُدٍ فِي ثَوْبٍ وَاحِدٍ ثُمَّ يَقُولُ أَيُّهُمْ أَكْثَرُ أَخْذًا لِلْقُرْآنِ فَإِذَا أُشِيرَ لَهُ إِلَى أَحَدِهِمَا قَدَّمَهُ فِي اللَّحْدِ وَقَالَ أَنَا شَهِيدٌ عَلَى هَؤُلَاءِ يَوْمَ الْقِيَامَةِ وَأَمَرَ بِدَفْنِهِمْ فِي دِمَائِهِمْ وَلَمْ يُغَسَّلُوا وَلَمْ يُصَلَّ عَلَيْهِمْ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"تَـعَلَّمُوا القرآنَ ، و سَلوا الله بهِ الجنةَ ، قبلَ أنْ يـتَـعَلَّمَهُ قومٌ ، يَسْأَلونَ بهِ الدنيا ، فإنَّ القرآنَ يـتَـعَلَّمَهُ ثلاثَةٌ : رجلٌ يُباهِي بهِ ، و رجلٌ يَسْتَأْكِلُ بهِ ، و رجلٌ يقرأُهُ لِلَّهِ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"لَيْسَ مِنَّا مَنْ لَمْ يَتَغَنَّ بِالْقُرْآنِ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"إنَّ الذي لَيْسَ في جوفِه شيءٌ منَ القُرْآن؛ كالبيت الخَرِب\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"إِنَّ لِلَّهِ أَهْلِينَ مِنْ النَّاسِ, قَالُوا يَا رَسُولَ اللَّهِ: مَنْ هُمْ ؟ قَالَ : هُمْ أَهْلُ الْقُرْآنِ ، أَهْلُ اللَّهِ وَخَاصَّتُهُ\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"يُقَالُ لِصَاحِبِ الْقُرْآنِ اقْرَأْ , وَارْتَقِ , وَرَتِّلْ كَمَا كُنْتَ تُرَتِّلُ فِي الدُّنْيَا , فَإِنَّ مَنْزِلَتَكَ عِنْدَ آخِرِ آيَةٍ تَقْرَأُ بِهَا\".**\n\n\n\n**و قال رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: **\n\n**\"يَجِيءُ الْقُرْآنُ يَوْمَ الْقِيَامَةِ فَيَقُولُ : يَا رَبِّ حَلِّهِ ، فَيُلْبَسُ تَاجَ الْكَرَامَةِ ، ثُمَّ يَقُولُ : يَا رَبِّ زِدْهُ ، فَيُلْبَسُ حُلَّةَ الْكَرَامَةِ ، ثُمَّ يَقُولُ : يَا رَبِّ ارْضَ عَنْهُ ، فَيَرْضَى عَنْهُ ، فَيُقَالُ لَهُ : اقْرَأْ وَارْقَ وَتُزَادُ بِكُلِّ آيَةٍ حَسَنَةً\".**", "أدعية للميّت": "**أدعية للميّت**\n\n**أدعية للمتوفى (ذكور)**\n\n**اللَّهُمَّ **\n\n**أبدله داراً خيراً من داره، وأهلاً خيراً من أهله، وأدخله الجنّة، وأعذه من عذاب القبر ومن عذاب النّار.**\n\n\n\n**اللَّهُمَّ **\n\n**عامله بما أنت أهله، ولا تعامله بما هو أهله.**\n\n\n\n**اللَّهُمَّ **\n\n**اجزه عن الإحسان إحساناً وعن الإساءة عفواً وغفراناً.**\n\n\n\n**اللَّهُمَّ **\n\n**إن كان محسناً فزد من حسناته، وإن كان مسيئاً فتجاوز عن سيّئاته.**\n\n\n\n**اللَّهُمَّ **\n\n**أدخله الجنّة من غير مناقشة حساب ولا سابقة عذاب.**\n\n\n\n**اللَّهُمَّ **\n\n**آنسه في وحدته وفي وحشته وفي غربته.**\n\n\n\n**اللَّهُمَّ **\n\n**أنزله منزلاً مباركاً وأنت خير المنزلين.**\n\n\n\n**اللَّهُمَّ **\n\n**أنزله منازل الصدّيقين والشّهداء والصّالحين، وحسن أولئك رفيقاً.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعل قبره روضةً من رياض الجنّة، ولا تجعله حفرةً من حفر النّار.**\n\n\n\n**اللَّهُمَّ **\n\n**افسح له في قبره مدّ بصره، وافرش قبره من فراش الجنّة.**\n\n\n\n**اللَّهُمَّ **\n\n**أعذه من عذاب القبر، وجفاف ِالأرض عن جنبيها.**\n\n\n\n**اللَّهُمَّ **\n\n**املأ قبره بالرّضا والنّور والفسحة والسّرور.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه في ذمّتك وحبل جوارك، فقِهِِ فتنة القبر، وعذاب النّار، وأنت أهل الوفاء والحقّ، فاغفر له وارحمه إنّك أنت الغفور الرّحيم.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه عبدك وابن عبدك خرج من الدّنيا وسعتها ومحبوبها وأحبّائه فيها إلى ظلمة القبر وما هو لاقيه.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه كان يشهد أنّك لا إله إلّا أنت وأنّ محمّداً عبدك ورسولك وأنت أعلم به.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّا نتوسّل بك إليك، ونقسم بك عليك أن ترحمه ولا تعذّبه، وأن تثبّته عند السؤال.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه نَزَل بك وأنت خير منزولٍ به، وأصبح فقيراً إلى رحمتك وأنت غنيٌّ عن عذابه.**\n\n\n\n**اللَّهُمَّ **\n\n**آته برحمتك ورضاك، وقهِ فتنة القبر وعذابه، وآته برحمتك الأمن من عذابك حتّى تبعثه إلى جنّتك يا أرحم الرّاحمين.**\n\n\n\n**اللَّهُمَّ **\n\n**انقله من مواطن الدّود وضيق اللحود إلى جنّات الخلود.**\n\n\n\n**اللَّهُمَّ **\n\n**احمه تحت الأرض، واستره يوم العرض، ولا تخزه يوم يبعثون \"يوم لا ينفع مالٌ ولا بنون إلّا من أتى الله بقلبٍ سليم\".**\n\n\n\n**اللَّهُمَّ **\n\n**يمّن كتابه، ويسّر حسابه، وثقّل بالحسنات ميزانه، وثبّت على الصّراط أقدامه، وأسكنه في أعلى الجنّات بجوار حبيبك ومصطفاك (صلّى الله عليه وسلّم).**\n\n\n\n**اللَّهُمَّ **\n\n**أمّنه من فزع يوم القيامة، ومن هول يوم القيامة، واجعل نفسه آمنة مطمئنّة، ولقّنه حجّته.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعله في بطن القبر مطمئنّاً وعند قيام الأشهاد آمن، وبجود رضوانك واثق، وإلى أعلى درجاتك سابق.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعل عن يمينه نوراً حتّى تبعثه آمناً مطمئنّاً في نورٍ من نورك.**\n\n\n\n**اللَّهُمَّ **\n\n**انظر إليه نظرة رضا، فإنّ من تنظر إليه نظرة رضا لا تعذّبه أبداً.**\n\n\n\n**اللَّهُمَّ **\n\n**أسكنه فسيح الجنان، واغفر له يا رحمن، وارحمه يا رحيم، وتجاوز عمّا تعلم يا عليم.**\n\n\n\n**اللَّهُمَّ **\n\n**اعف عنه فإنّك القائل \"ويعفو عن كثير\".**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه جاء ببابك، وأناخ بجنابك، فَجد عليه بعفوك وإكرامك وجود إحسانك.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّ رحمتك وسعت كلّ شيء فارحمه رحمةً تطمئنّ بها نفسه، وتقرّ بها عينه.**\n\n\n\n**اللَّهُمَّ **\n\n**احشره مع المتّقين إلى الرّحمن وفداً.**\n\n\n\n**اللَّهُمَّ **\n\n**احشره مع أصحاب اليمين، واجعل تحيّته سلامٌ لك من أصحاب اليمين.**\n\n\n\n**اللَّهُمَّ **\n\n**بشّره بقولك \"كلوا واشربوا هنيئاً بما أسلفتم في الأيّام الخالية\".**\n\n\n\n**اللَّهُمَّ **\n\n**اجعله من الّذين سعدوا في الجنّة خالدين فيها ما دامت السموات والأرض.**\n\n\n\n**اللَّهُمَّ **\n\n**لا نزكّيه عليك، ولكنّا نحسبه أنّه أمن وعمل صالحاً، فاجعل له جنّتين ذواتي أفنان بحقّ قولك: \"ولمن خاف مقام ربّه جنّتان\".**\n\n\n\n**اللَّهُمَّ **\n\n**شفع فيه نبيّنا ومصطفاك، واحشره تحت لوائه، واسقه من يده الشّريفة شربةً هنيئةً لا يظمأ بعدها أبداً.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعله في جنّة الخلد \"الَّتِي وُعِدَ الْمُتَّقُونَ كَانَتْ لَهُمْ جَزَاء وَمَصِيرًا. لَهُمْ فِيهَا مَا يَشَاؤُونَ خَالِدِينَ كَانَ عَلَى رَبِّكَ وَعْدًا مَسْؤُولا\".**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه صبر على البلاء فلم يجزع، فامنحه درجة الصّابرين الّذين يوفون أجورهم بغير حساب فإنّك القائل \"إنّما يوفي الصّابرون أجرهم بغير حساب\".**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه كان مصلّ لك، فثبّته على الصّراط يوم تزل الأقدام.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه كان صائماً لك، فأدخله الجنّة من باب الريّان.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه كان لكتابك تالٍ وسامع، فشفّع فيه القرآن، وارحمه من النّيران، واجعله يا رحمن يرتقي في الجنّة إلى آخر آية قرأها أو سمعها، وآخر حرفٍ تلاه.**\n\n\n\n**اللَّهُمَّ **\n\n**ارزقه بكلّ حرفٍ في القرآن حلاوة، وبكلّ كلمة كرامة، وبكلّ اّية سعادة، وبكلّ سورة سلامة، وبكل جْزءٍ جزاء.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمه فإنّه كان مسلماً، واغفر له فإنّه كان مؤمناً، وأدخله الجنّة فإنّه كان بنبيّك مصدّقاً، وسامحه فإنّه كان لكتابك مرتّلاً.**\n\n\n\n**اللَّهُمَّ **\n\n**اغفر لحيّنا وميّتنا، وشاهدنا وغائبنا، وصغيرنا وكبيرنا، وذَكرنَا وأنثانا.**\n\n\n\n**اللَّهُمَّ **\n\n**من أحييته منّا فأحيه على الإسلام، ومن توفّيته منّا فتوفّه على الإيمان.**\n\n\n\n**اللَّهُمَّ **\n\n**لا تحرمنا أجره ولا تضللنا بعده.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا أتانا اليقين، وعرق منّا الجبين، وكثر الأنين والحنين.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا يئس منّا الطبيب، وبكى علينا الحبيب، وتخلّى عنّا القريب والغريب، وارتفع النّشيج والنّحيب.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا اشتدّت الكربات، وتوالت الحسرات، وأطبقت الرّوعات، وفاضت العبرات، وتكشّفت العورات، وتعطّلت القوى والقدرات.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا حُمِلنا على الأعناقِ، وبلغتِ التراقِ، وقيل من راق وظنّ أنّه الفراق والتفَّتِ السَّاقُ بالسَّاقِ، إليك يا ربَّنا يومئذٍ المساق.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا ورينا التّراب، وغلقت القبور والأبواب، وانفضّ الأهل والأحباب، فإذا الوحشة والوحدة وهول الحساب.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا فارقنا النّعيم، وانقطع النّسيم، وقيل ما غرّك بربّك الكريم.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا أقمنا للسؤال، وخاننا المقال، ولم ينفع جاهٌ ولامال ولا عيال، وقد حال الحال، وليس إلّا فضل الكبير المتعال.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا نَسي اسمنا، ودَرس رسمنا، وأحاط بنا قسمنا ووسعنا.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا أهملنا فلم يزرنا زائر، ولم يذكرنا ذاكر، وما لنا من قوّة ولا ناصر، فلا أمل إلّا في القاهر القادر الغافر، يا من إذا وعد أوفى، وإذا توعّد عفا، وشفّع يا ربّ فينا حبيبنا المصطفى، واجعلنا ممّن صفا ووفا، وبالله اكتفى، يا أرحم الرّاحمين، يا حيّ يا قيّوم، يا بديع السموات والأرض، يا ذا الجلال والإكرام.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّه عبدك وابن عبدك وابن أمتك مات وهو يشهد لك بالوحدانيّة ولرسولك بالشّهادة فاغفر له إنّك أنت الغفّار.**\n\n\n\n**اللَّهُمَّ **\n\n**لا تحرمنا أجره، ولا تفتنّا بعده، واغفر لنا وله، واجمعنا معه في جنّات النّعيم يا ربّ العالمين.**\n\n\n\n**اللَّهُمَّ **\n\n**أنزل على أهله الصّبر والسلوان وارضهم بقضائك.**\n\n\n\n**اللَّهُمَّ **\n\n**ثبّتنا على القول الثّابت في الحياة الدّنيا، وفي الآخرة، ويوم يقوم الأشهاد.**\n\n\n\n**اللَّهُمَّ **\n\n**صلّ وسلّم وبارك على سيّدنا محمّد، وعلى اّله وصحبه وسلّم إلى يوم الدّين.**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 1  |   |\n\n---\n\n**أدعية للمتوفية (إناث)**\n\n**اللَّهُمَّ **\n\n**أبدلها داراً خيراً من دارها، وأهلاً خيراً من أهلها، وأدخلها الجنّة، وأعذها من عذاب القبر ومن عذاب النّار.**\n\n\n\n**اللَّهُمَّ **\n\n**عاملها بما أنت أهله، ولا تعاملها بما هى أهله.**\n\n\n\n\n**اللَّهُمَّ **\n\n**اجزها عن الإحسان إحساناً وعن الإساءة عفواً وغفراناً.**\n\n\n\n**اللَّهُمَّ **\n\n**إن كانت محسنةً فزد من حسناتها، وإن كان مسيئةً فتجاوز عن سيّئاتها.**\n\n\n\n**اللَّهُمَّ **\n\n**أدخلها الجنّة من غير مناقشة حساب ولا سابقة عذاب.**\n\n\n\n**اللَّهُمَّ **\n\n**اّنسها في وحدتها وفي وحشتها وفي غربتها.**\n\n\n\n**اللَّهُمَّ **\n\n**أنزلها منزلاً مباركاً وأنت خير المنزلين.**\n\n\n\n**اللَّهُمَّ **\n\n**أنزلها منازل الصدّيقين والشّهداء والصّالحين، وحسن أولئك رفيقاً.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعل قبرها روضةً من رياض الجنّة، ولا تجعله حفرةً من حفر النّار.**\n\n\n\n**اللَّهُمَّ **\n\n**افسح لها في قبرها مدّ بصرها، وافرش قبرها من فراش الجنّة.**\n\n\n\n**اللَّهُمَّ **\n\n**أعذها من عذاب القبر، وجفاف ِالأرض عن جنبيها.**\n\n\n\n**اللَّهُمَّ **\n\n**املأ قبرها بالرّضا والنّور والفسحة والسّرور.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها في ذمّتك وحبل جوارك، فقِهِا فتنة القبر، وعذاب النّار، وأنت أهل الوفاء والحقّ، فاغفر لهه وارحمها إنّك أنت الغفور الرّحيم.**\n\n\n\n**اللَّهُمَّ **\n\n**إنها أمتك وبنت أمتك خرجت من الدّنيا وسعتها ومحبوبيها وأحبائها فيها إلى ظلمة القبر وما هى لاقته.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها كانت تشهد أنّك لا إله إلّا أنت وأنّ محمّداً عبدك ورسولك وأنت أعلم به.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّا نتوسّل بك إليك، ونقسم بك عليك أن ترحمها ولا تعذّبها، وأن تثبّتها عند السؤال.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها نَزَلت بك وأنت خير منزولٍ به، وأصبحت فقيرةً إلى رحمتك وأنت غنيٌّ عن عذابها.**\n\n\n\n**اللَّهُمَّ **\n\n**آتها برحمتك ورضاك، وقهِا فتنة القبر وعذابه، وآتها برحمتك الأمن من عذابك حتّى تبعثها إلى جنّتك يا أرحم الرّاحمين.**\n\n\n\n**اللَّهُمَّ **\n\n**انقلها من مواطن الدّود وضيق اللحود إلى جنّات الخلود.**\n\n\n\n**اللَّهُمَّ **\n\n**احمها تحت الأرض، واسترها يوم العرض، ولا تخزها يوم يبعثون “يوم لا ينفع مالٌ ولا بنون إلّا من أتى الله بقلبٍ سليم”.**\n\n\n\n**اللَّهُمَّ **\n\n**يمّن كتابها، ويسّر حسابها، وثقّل بالحسنات ميزانها، وثبّت على الصّراط أقدامها، وأسكنها في أعلى الجنّات بجوار حبيبك ومصطفاك (صلّى الله عليه وسلّم).**\n\n\n\n**اللَّهُمَّ **\n\n**أمّنها من فزع يوم القيامة، ومن هول يوم القيامة، واجعل نفسها آمنة مطمئنّة، ولقّنها حجّتها.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعلها في بطن القبر مطمئنّةً وعند قيام الإشهاد آمنةً، وبجود رضوانك واثقةً، وإلى أعلى درجاتك سابقةً.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعل عن يمينها نوراً حتّى تبعثها آمنةً مطمئنّةً في نورٍ من نورك.**\n\n\n\n**اللَّهُمَّ **\n\n**انظر إليها نظرة رضا، فإنّ من تنظر إليه نظرة رضا لا تعذّبه أبداً.**\n\n\n\n**اللَّهُمَّ **\n\n**أسكنها فسيح الجنان، واغفر لها يا رحمن، وارحمها يا رحيم، وتجاوز عمّا تعلم يا عليم.**\n\n\n\n**اللَّهُمَّ **\n\n**اعف عنها فإنّك القائل “ويعفو عن كثير”.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها جاءت ببابك، وأناخت بجنابك، فَجد عليها بعفوك وإكرامك وجود إحسانك.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّ رحمتك وسعت كلّ شيء فارحمها رحمةً تطمئنّ بها نفسها، وتقرّ بها عينها.**\n\n\n\n**اللَّهُمَّ **\n\n**احشرها مع المتّقين إلى الرّحمن وفداً.**\n\n\n\n**اللَّهُمَّ **\n\n**احشرها مع أصحاب اليمين، واجعل تحيّتها سلامٌ لك من أصحاب اليمين.**\n\n\n\n**اللَّهُمَّ **\n\n**بشّرها بقولك “كلوا واشربوا هنيئاً بما أسلفتم في الأيّام الخالية”**\n\n\n\n**اللَّهُمَّ **\n\n**اجعلها من الّذين سعدوا في الجنّة خالدين فيها ما دامت السموات والأرض.**\n\n\n\n**اللَّهُمَّ **\n\n**لا نزكّيها عليك، ولكنّا نحسبها أنّها أمنت وعملت صالحاً، فاجعل لها جنّتين ذواتي أفنان بحقّ قولك: “ولمن خاف مقام ربّه جنّتان”.**\n\n\n\n**اللَّهُمَّ **\n\n**شفع فيها نبيّنا ومصطفاك، واحشرها تحت لوائه، واسقها من يده الشّريفة شربةً هنيئةً لا تظمأ بعدها أبداً.**\n\n\n\n**اللَّهُمَّ **\n\n**اجعلها في جنّة الخلد \"الَّتِي وُعِدَ الْمُتَّقُونَ كَانَتْ لَهُمْ جَزَاء وَمَصِيرًا. لَهُمْ فِيهَا مَا يَشَاؤُونَ خَالِدِينَ كَانَ عَلَى رَبِّكَ وَعْدًا مَسْؤُولا\".**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها صبرت على البلاء فلم تجزع، فامنحها درجة الصّابرين الّذين يوفون أجورهم بغير حساب فإنّك القائل \"إنّما يوفي الصّابرون أجرهم بغير حساب\".**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها كانت تصلّى لك، فثبّتها على الصّراط يوم تزل الأقدام.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها كانت صائمةً لك، فأدخلها الجنّة من باب الريّان.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها كانت لكتابك تاليةً وسامعةً، فشفّع فيها القرآن، وارحمها من النّيران، واجعلها يا رحمن ترتقي في الجنّة إلى آخر آية قرأتها أو سمعتها، وآخر حرفٍ تلته.**\n\n\n\n**اللَّهُمَّ **\n\n**ارزقها بكلّ حرفٍ في القرآن حلاوة، وبكلّ كلمة كرامة، وبكلّ اّية سعادة، وبكلّ سورة سلامة، وبكل جْزءٍ جزاء.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمها فإنّها كان مسلمةً، واغفر لها فإنّها كان مؤمنةً، وأدخلها الجنّة فإنّها كانت بنبيّك مصدّقةً، وسامحها فإنّها كانت لكتابك مرتّلةً.**\n\n\n\n**اللَّهُمَّ **\n\n**اغفر لحيّنا وميّتنا، وشاهدنا وغائبنا، وصغيرنا وكبيرنا، وذَكرنَا وأنثانا.**\n\n\n\n**اللَّهُمَّ **\n\n**من أحييته منّا فأحيه على الإسلام، ومن توفّيته منّا فتوفّه على الإيمان.**\n\n\n\n**اللَّهُمَّ **\n\n**لا تحرمنا أجرها ولا تضللنا بعدها.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا أتانا اليقين، وعرق منّا الجبين، وكثر الأنين والحنين.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا يئس منّا الطبيب، وبكى علينا الحبيب، وتخلّى عنّا القريب والغريب، وارتفع النّشيج والنّحيب.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا اشتدّت الكربات، وتوالت الحسرات، وأطبقت الرّوعات، وفاضت العبرات، وتكشّفت العورات، وتعطّلت القوى والقدرات.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا حُمِلنا على الأعناقِ، وبلغتِ التراقِ، وقيل من راق وظنّ أنّه الفراق والتفَّتِ السَّاقُ بالسَّاقِ، إليك يا ربَّنا يومئذٍ المساق.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا ورينا التّراب، وغلقت القبور والأبواب، وانفضّ الأهل والأحباب، فإذا الوحشة والوحدة وهول الحساب.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا فارقنا النّعيم، وانقطع النّسيم، وقيل ما غرّك بربّك الكريم.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا أقمنا للسؤال، وخاننا المقال، ولم ينفع جاهٌ ولامال ولا عيال، وقد حال الحال، وليس إلّا فضل الكبير المتعال.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا نَسي اسمنا، ودَرس رسمنا، وأحاط بنا قسمنا ووسعنا.**\n\n\n\n**اللَّهُمَّ **\n\n**ارحمنا إذا أهملنا فلم يزرنا زائر، ولم يذكرنا ذاكر، وما لنا من قوّة ولا ناصر، فلا أمل إلّا في القاهر القادر الغافر، يا من إذا وعد أوفى، وإذا توعّد عفا، وشفّع يا ربّ فينا حبيبنا المصطفى، واجعلنا ممّن صفا ووفا، وبالله اكتفى، يا أرحم الرّاحمين، يا حيّ يا قيّوم، يا بديع السموات والأرض، يا ذا الجلال والإكرام.**\n\n\n\n**اللَّهُمَّ **\n\n**إنّها امتك بنت أمتك ماتت وهى تشهد لك بالوحدانيّة ولرسولك بالشّهادة فاغفر لها إنّك أنت الغفّار.**\n\n\n\n**اللَّهُمَّ **\n\n**لا تحرمنا أجرها، ولا تفتنّا بعدها، واغفر لنا ولها، واجمعنا معها في جنّات النّعيم يا ربّ العالمين.**\n\n\n\n**اللَّهُمَّ **\n\n**أنزل على أهلها الصّبر والسلوان وارضهم بقضائك.**\n\n\n\n**اللَّهُمَّ **\n\n**ثبّتنا على القول الثّابت في الحياة الدّنيا، وفي الآخرة، ويوم يقوم الأشهاد.**\n\n\n\n**اللَّهُمَّ **\n\n**صلّ وسلّم وبارك على سيّدنا محمّد، وعلى اّله وصحبه وسلّم إلى يوم الدّين.**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 2  |   |\n\n---\n\n**أدعية للميّت الطفل الصغير (ذكر أو أنثى)**\n\n**اللَّهُمَّ **\n\n**اجْعَلْهُ فَرَطَاً وَذُخْراً لِوَالِدَيْهِ، وشَفِيعاً مُجَاباً، اللَّهُمَّ ثَقِّلْ بِهِ مَوَازِيْنَهُمَا، وأعْظِمْ بهِ أُجُورَهُمَا، وألْحِقْهُ بِصَالِحِ الـمُؤْمِنينَ، واجْعَلْهُ فِي كَفَالَةِ إِبْرَاهِيمَ، وَقِهِ بِرَحْمَتِكَ عَذَابَ الجَحِيمِ، وأبْدِلْهُ دَاراً خَيْراً مِنْ دَارِهِ، وَأَهْلاً خَيْراً مِنْ أَهْلِهِ، اللَّهُمَّ اغْفِرْ لأسْلاَفِنَا، وَأَفْرَاطِنَا، وَمَنْ سَبَقَنا بالإيْمَانِ.**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 3  |   |\n\n---\n\n**الدّعاء للميّت في صّلاة الجنازة**\n\n**اللَّهُمَّ **\n\n**اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ ، وَأَكْرِمْ نُزُلَهُ ، وَوَسِّعْ مُدْخَلَهُ ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ ، وَنَقِّهِ مِنْ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنْ الدَّنَسِ ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ ، وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ ، وَأَدْخِلْهُ الْجَنَّةَ ، وَقِهِ فِتْنَةَ الْقَبْرِ وَعَذَابَ النَّارِ.**", "الرّقية الشرعية": "**الرُّقية الشرعية من القرآن والسنة**\n\n**الرُّقية الشرعية كاملة من القرآن والسنة**\n\n**الرقية الشرعية أسباب شرعية للعلاج والاستشفاء والشفاء من الله سبحانه وتعالى ولا يملك أحد من الخلق ضراً ولا نفعاً ، ولذلك يجب اللجوء إلى الله سبحانه وتعالى دون سائر الخلق.**\n\n**إرشادات عامة يجب أن تُراعى عند الرقية الشرعية**\n\n**\\* **\n\n**أن لا يعتقد الراقي أن الرقية تؤثر بذاتها بل بذات الله سبحانه وتعالى.**\n\n\n\n**\\* **\n\n**كون الراقي والمرقي على طهارة تامة.**\n\n\n\n**\\* **\n\n**استقبال الراقي القبلة.**\n\n\n\n**\\* **\n\n**لزوم تدبر الراقي والمرقي لنصوص الرقية، فلا يقولها الراقي دون تفكر بمعانيها، ولا يستمعها المرقي إلا وقد اجتهد في تدبرها، واستحضر كلاهما الخشوع في أثناء الرقية بتعلق القلب بعظيم قدرة الله -تعالى- وحسن الاستعانة به سبحانه.**\n\n\n\n**\\* **\n\n**بإمكان الراقي الاقتصار في الرقية على الآيات القرآنية أو التعوذات النبوية، لكن الأكمل في ذلك أن يجمع بينها.**\n\n\n\n**\\* **\n\n**بإمكان الراقي أن يختار ما يناسب حسبما يتسع له وللمرقي الوقت، كما أن له الاختصار في الرقية، بحيث يختار منها ما يناسب حال المرقي، وللراقي كذلك قراءة الرقية على مراحل، بحيث يستريح المريض بينها.**\n\n\n\n**\\* **\n\n**النفث - وهو نفخ لطيف مع بعض ريق - في أثناء القراءة وبعدها، ولا بأس بتركه.**\n\n\n\n**\\* **\n\n**استحسان وضع اليد في أثناء القراءة على الناصية أو على موضع الألم، مع ملاحظة عدم جواز مس النساء من غير المحارم.**\n\n\n\n**\\* **\n\n**إن لاحظ الراقي تأثر المريض ببعض الآيات في أثناء الرقية، فلا بأس بتكرارها ثلاثًا، أو خمسًا، أو سبع مرار، حسب الحاجة وملاحظة درجة الاستجابة.**\n\n\n\n**\\* **\n\n**أن ينوي الراقي برقيته نفع أخيه، ومحبة أن يشفيه الله ويخفف عنه، وكذلك توخي هدايته، بل إن تيقن الراقي وجود جني متلبس، حرص عندئذ على تخليص المرقي من ذلك التلبس، مع حرصه كذلك على دعوة ذلك الجني إلى التقوى والاستقامة، وهذا مطلب مهم جدًا ينبغي للراقي ملاحظته؛ ذلك أن همَّ المسلم الأعظم الدعوة إلى الله -تعالى- لقول المولى - عز وجل -: ﴿ قُلْ هَذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ عَلَى بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي ﴾ [يوسف: 108]، فالمسلم داعية في المقام الأول؛ فحري به أن يباشر رقيته وهو يحمل في صدره هاتين النيتين (الشفاء، ومحبة الهداية)، وليتنبه الراقي إلى أنه لا ينبغي له أن يسعى إلى أذية الجني ابتداءً، إلا إذا استعصت عليه سبل هدايته، فكم من جني متلبس تاب وأناب على يد راق، بل كم من شيطان مارد أسلم على يديه، فكتب الله -تعالى- شفاءً للمريض وهداية للجني.**\n\n\n\n**\\* **\n\n**مراعاة لفظ الرقية المناسب للمقام عند القراءة فيقول: (أرقي نفسي)، (أرقيكَ) أو (أرقيكِ)، أو (أرقيكم)، وذلك بحسب الحال.**\n\n\n\n**\\* **\n\n**قد تستمر الرقية لمدة أسبوع كامل، وربما كانت أقل من ذلك، أو أكثر، وذلك بحسب حال المريض ومدى استجابته للعلاج، حتى يتم الشفاء بإذن الله.**\n\n\n\n**\\* **\n\n**إذا جزم الراقي بأن المرقي يعاني من سحر - والعياذ بالله - فإنه من المهم للغاية أن يركز في رقيته على الآيات التي ذكر فيها السحر، مع تكرار قراءتها على المسحور، وبخاصة المعوذتين، ففي ذلك تأثير بالغ على فك السحر، ودفع الأذى، بإذن الله.**\n\n\n\n**\\* **\n\n**إن للراقي القراءة جهرًا أو سرًّا، والجهر أولى، وذلك بصوت معتدل يتمكن معه المرقي من سماعه؛ فيزداد بذلك تأثره بالرقية وانتفاعه بها.**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 1  |   |\n\n---\n\n**الرُّقية الشرعية من القرآن الكريم**\n\n**\\* **\n\n**بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ ﴿1﴾ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿2﴾ الرَّحْمَنِ الرَّحِيمِ ﴿3﴾ مَالِكِ يَوْمِ الدِّينِ ﴿4﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿5﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿6﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿7﴾. [الفاتحة: 1-7]**\n\n\n\n**\\* **\n\n**الم ﴿1﴾ ذَلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ هُدًى لِلْمُتَّقِينَ ﴿2﴾ الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ ﴿3﴾ وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالْآَخِرَةِ هُمْ يُوقِنُونَ ﴿4﴾ أُولَئِكَ عَلَى هُدًى مِنْ رَبِّهِمْ وَأُولَئِكَ هُمُ الْمُفْلِحُونَ ﴿5﴾. [البقرة: 1-5]**\n\n\n\n\n**\\* **\n\n**اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ. [آية الكرسى - البقرة 255]**\n\n\n\n\n**\\* **\n\n**لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَإِنْ تُبْدُوا مَا فِي أَنْفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُمْ بِهِ اللَّهُ فَيَغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ وَاللَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ﴿284﴾ آَمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آَمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿285﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿286﴾. [البقرة: 284-286]**\n\n\n\n**\\* **\n\n**قُلْ يَا أَيُّهَا الْكَافِرُونَ ﴿1﴾ لَا أَعْبُدُ مَا تَعْبُدُونَ ﴿2﴾ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿3﴾ وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ ﴿4﴾ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿5﴾ لَكُمْ دِينُكُمْ وَلِيَ دِينِ ﴿6﴾. [الكافرون]**\n\n\n\n**\\* **\n\n**قُلْ هُوَ اللَّهُ أَحَدٌ ﴿1﴾ اللَّهُ الصَّمَدُ ﴿2﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿3﴾ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ﴿4﴾. [الإخلاص]**\n\n\n\n**\\* **\n\n**قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿1﴾ مِنْ شَرِّ مَا خَلَقَ ﴿2﴾ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿3﴾ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿4﴾ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿5﴾. [الفلق]**\n\n\n\n**\\* **\n\n**قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿1﴾ مَلِكِ النَّاسِ ﴿2﴾ إِلَهِ النَّاسِ ﴿3﴾ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿4﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿5﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿6﴾. [الناس]**\n\n| 01 |   |\n| -- | - |\n| 01 |   |\n| 2  |   |\n\n---\n\n**الرُّقية الشرعية من السنة النبوية**\n\n**\\* **\n\n**أَعُوذُ بِاللَّهِ الْعَظِيمِ، وَبِوَجْهِهِ الْكَرِيمِ، وَسُلْطَانِهِ الْقَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ.**\n\n\n\n**\\* **\n\n**أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ، مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ.**\n\n\n\n**\\* **\n\n**أعوذُ بكلماتِ اللهِ التامَّةِ ، مِن كُلِّ شيطانٍ وهامَّةٍ ، ومِن كُلِّ عَيْنٍ لامَّةٍ.**\n\n\n\n**\\* **\n\n**أعوذُ بكلماتِ اللهِ التامَّاتِ مِن شرِّ ما خَلق.**\n\n\n\n**\\* **\n\n**بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ.**\n\n\n\n**\\* **\n\n**بِسْمِ اللَّهِ (ثَلَاثًا)، أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (سَبْعَ مَرَّاتٍ).**\n\n\n\n**\\* **\n\n**أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ، أَنْ يُعَافِيَكَ وَيَشْفِيَكَ.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ ربَّ النَّاسِ، أَذْهِب الْبَأسَ، واشْفِ، أَنْتَ الشَّافي لا شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفاءً لا يُغَادِرُ سقَماً.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ اشْفِ عَبْدَكَ، وصَدِّقْ رَسُولَك.**\n\n\n\n**\\* **\n\n**اللهُمَّ بَارِكْ عَلَيْهِ، وَأَذْهِبْ عَنْهُ حَرَّ الْعَيْنِ وَبَرْدَهَا وَوَصَبَهَا.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ إِنَّا نَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ صلى الله عليه وسلم وَنَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ صلى الله عليه وسلم وَأَنْتَ الْمُسْتَعَانُ، وَعَلَيْكَ الْبَلَاغُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.**\n\n\n\n**\\* **\n\n**لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْكَرِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْعَرْشِ الْعَظِيمِ.**\n\n\n\n**\\* **\n\n**رَبّنَا الَّلهُ الذِي فِي السَّمَاءِ، تَقَدَّسَ اسمُكَ، أَمرُكَ فِي السَّمَاءِ وَالأَرْضِ، كَمَا رَحمَتُكَ فِي السَّمَاءِ فَاجْعَلْ رَحْمَتَكَ فِي الأَرْضِ، اغفِر لَنَا حَوْبَنَا وَخَطَايَانَا، أَنتَ رَبُّ الطَّيِّبِينَ، أَنزِلْ رَحْمَةً مِن رَحمَتِكَ، وَشِفَاءً مِن شِفَائِكَ عَلَى هَذَا الوَجَعِ، فَيَبرَأ. (ثلاث مرات).**\n\n\n\n**\\* **\n\n**أَعُوذُ بِوَجْهِ اللَّهِ الْكَرِيمِ، وَبِكَلِمَاتِ اللَّهِ التَّامَّاتِ، اللَّاتِي لَا يُجَاوِزُهُنَّ بَرٌّ وَلَا فَاجِرٌ، مِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ وَشَرِّ مَا يُعْرُجُ فِيهَا، وَشَرِّ مَا ذَرَأَ فِي الْأَرْضِ وَشَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ طَوَارِقِ اللَّيْلِ وَالنَّهَارِ، إِلَّا طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ .**\n\n\n\n**\\* **\n\n**بِسـمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِـهِ شَيءٌ في الأرْضِ وَلا في السّمـاءِ وَهـوَ السّمـيعُ العَلـيم. (ثلاث مرات).**\n\n\n\n**\\* **\n\n**أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّةِ مِنْ غَضَبِهِ وَعِقَابِهِ ، وَشَرِّ عِبَادِهِ ، وَمَنْ هَمَزَاتِ الشَّيَاطِينِ ، وَأَنْ يَحْضُرُونِ.**\n\n\n\n**\\* **\n\n**بِسْمِ اللَّهِ الْعَظِيمِ ، أَعُوذُ بِاللَّهِ الْكَبِيرِ مِنْ شَرِّ كُلِّ عِرْقٍ نَعَّارٍ ، وَمِنْ شَرِّ حَرِّ النَّارِ.**\n\n\n\n**\\* **\n\n**بِسْمِ اللهِ تربَةُ أَرْضِنَا، بِرِيقةِ بَعْضِنَا، يُشْفَى سَقِيمُنَا، بإِذْنِ رَبِّنَا.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لَا إِلَهَ إِلَّا أَنْتَ، الْمَنَّانُ يَا بَدِيعَ السَّمَاوَاتِ وَالْأَرْضِ، يَا ذَا الْجَلَالِ وَالْإِكْرَامِ، يَا حَيُّ يَا قَيُّومُ.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّه لاَ إِلَهَ إِلاَّ أَنْتَ، الأَحَدُ، الصَّمَدُ، الَّذِي لَمْ يَلِدْ، وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.**\n\n\n\n**\\* **\n\n**أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ، أَنْ يُعَافِيَكَ وَيَشْفِيَكَ. (سبع مرات).**\n\n\n\n**\\* **\n\n**اللَّهُمَّ بَرِّدْ قَلْبِي بِالثَّلْجِ وَالْبَرَدِ وَالْمَاءِ الْبَارِدِ ، اللَّهُمَّ نَقِّ قَلْبِي مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ إِنِّي أَعُوذُ بِوَجْهِكَ الْكَرِيمِ وَكَلِمَاتِكَ التَّامَّةِ مِنْ شَرِّ مَا أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللَّهُمَّ أَنْتَ تَكْشِفُ الْمَغْرَمَ وَالْمَأْثَمَ، اللَّهُمَّ لَا يُهْزَمُ جُنْدُكَ، وَلَا يُخْلَفُ وَعْدُكَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ، سُبْحَانَكَ وَبِحَمْدِكَ.**\n\n\n\n**\\* **\n\n**بِاسْمِ اللَّهِ يُبْرِيكَ، وَمِنْ كُلِّ دَاءٍ يَشْفِيكَ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ، وَشَرِّ كُلِّ ذِي عَيْنٍ.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ اشْفِ عَبْدَكَ يَنْكَأُ لَكَ عَدُوًّا ، أَوْ يَمْشِي لَكَ إِلَى صَلاةٍ.**\n\n\n\n**\\* **\n\n**اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ.**", "أذكار الصباح": "**أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ\n\nاللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ.**\n**من قالها حين يصبح أجير من الجن حتى يمسي، ومن قالها حين يمسي أجير من الجن حتى يصبح.**\n| 1 |\n---\n**بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم\n\nقُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌ.**\n**من قالها حين يصبح وحين يمسي كفته من كل شيء (الإخلاص والمعوذتين).**\n| 3 |\n---\n**بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم\n\nقُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ.**\n| 3 |\n---\n**بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم\n\nقُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ، مَلِكِ ٱلنَّاسِ، إِلَٰهِ ٱلنَّاسِ، مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ، ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ، مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ.**\n| 3 |\n---\n**أَصْـبَحْنا وَأَصْـبَحَ المُـلْكُ لله وَالحَمدُ لله ، لا إلهَ إلاّ اللّهُ وَحدَهُ لا شَريكَ لهُ، لهُ المُـلكُ ولهُ الحَمْـد، وهُوَ على كلّ شَيءٍ قدير ، رَبِّ أسْـأَلُـكَ خَـيرَ ما في هـذا اليوم وَخَـيرَ ما بَعْـدَه ، وَأَعـوذُ بِكَ مِنْ شَـرِّ ما في هـذا اليوم وَشَرِّ ما بَعْـدَه، رَبِّ أَعـوذُبِكَ مِنَ الْكَسَـلِ وَسـوءِ الْكِـبَر ، رَبِّ أَعـوذُ بِكَ مِنْ عَـذابٍ في النّـارِ وَعَـذابٍ في القَـبْر.**\n| 1 |\n---\n**اللّهـمَّ أَنْتَ رَبِّـي لا إلهَ إلاّ أَنْتَ ، خَلَقْتَنـي وَأَنا عَبْـدُك ، وَأَنا عَلـى عَهْـدِكَ وَوَعْـدِكَ ما اسْتَـطَـعْت ، أَعـوذُبِكَ مِنْ شَـرِّ ما صَنَـعْت ، أَبـوءُ لَـكَ بِنِعْـمَتِـكَ عَلَـيَّ وَأَبـوءُ بِذَنْـبي فَاغْفـِرْ لي فَإِنَّـهُ لا يَغْـفِرُ الذُّنـوبَ إِلاّ أَنْتَ.**\n**من قالها موقنًا بها حين يمسي ومات من ليلته دخل الجنة، وكذلك حين يصبح.**\n| 1 |\n---\n**رَضيـتُ بِاللهِ رَبَّـاً وَبِالإسْلامِ ديـناً وَبِمُحَـمَّدٍ صلى الله عليه وسلم نَبِيّـاً.**\n**من قالها حين يصبح وحين يمسي كان حقًا على الله أن يرضيه يوم القيامة.**\n| 3 |\n---\n**اللّهُـمَّ إِنِّـي أَصْبَـحْتُ أُشْـهِدُك ، وَأُشْـهِدُ حَمَلَـةَ عَـرْشِـك ، وَمَلَائِكَتَكَ ، وَجَمـيعَ خَلْـقِك ، أَنَّكَ أَنْـتَ اللهُ لا إلهَ إلاّ أَنْـتَ وَحْـدَكَ لا شَريكَ لَـك ، وَأَنَّ ُ مُحَمّـداً عَبْدُكَ وَرَسـولُـك.**\n**من قالها أعتقه الله من النار.**\n| 4 |\n---\n**اللّهُـمَّ ما أَصْبَـَحَ بي مِـنْ نِعْـمَةٍ أَو بِأَحَـدٍ مِـنْ خَلْقِك ، فَمِـنْكَ وَحْدَكَ لا شريكَ لَـك ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْر.**\n**من قالها حين يصبح أدى شكر يومه.**\n| 1 |\n---\n**حَسْبِـيَ اللّهُ لا إلهَ إلاّ هُوَ عَلَـيهِ تَوَكَّـلتُ وَهُوَ رَبُّ العَرْشِ العَظـيم.**\n**من قالها كفاه الله ما أهمه من أمر الدنيا والآخرة.**\n| 7 |\n---\n**بِسـمِ اللهِ الذي لا يَضُـرُّ مَعَ اسمِـهِ شَيءٌ في الأرْضِ وَلا في السّمـاءِ وَهـوَ السّمـيعُ العَلـيم.**\n**لم يضره من الله شيء.**\n| 3 |\n---\n**اللّهُـمَّ بِكَ أَصْـبَحْنا وَبِكَ أَمْسَـينا ، وَبِكَ نَحْـيا وَبِكَ نَمُـوتُ وَإِلَـيْكَ النُّـشُور.**\n| 1 |\n---\n**أَصْبَـحْـنا عَلَى فِطْرَةِ الإسْلاَمِ، وَعَلَى كَلِمَةِ الإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إبْرَاهِيمَ حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ المُشْرِكِينَ.**\n| 1 |\n---\n**سُبْحـانَ اللهِ وَبِحَمْـدِهِ عَدَدَ خَلْـقِه ، وَرِضـا نَفْسِـه ، وَزِنَـةَ عَـرْشِـه ، وَمِـدادَ كَلِمـاتِـه.**\n| 3 |\n---\n**اللّهُـمَّ عافِـني في بَدَنـي ، اللّهُـمَّ عافِـني في سَمْـعي ، اللّهُـمَّ عافِـني في بَصَـري ، لا إلهَ إلاّ أَنْـتَ.**\n| 3 |\n---\n**اللّهُـمَّ إِنّـي أَعـوذُ بِكَ مِنَ الْكُـفر ، وَالفَـقْر ، وَأَعـوذُ بِكَ مِنْ عَذابِ القَـبْر ، لا إلهَ إلاّ أَنْـتَ.**\n| 3 |\n---\n**اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في الدُّنْـيا وَالآخِـرَة ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ العَـفْوَ وَالعـافِـيةَ في ديني وَدُنْـيايَ وَأهْـلي وَمالـي ، اللّهُـمَّ اسْتُـرْ عـوْراتي وَآمِـنْ رَوْعاتـي ، اللّهُـمَّ احْفَظْـني مِن بَـينِ يَدَيَّ وَمِن خَلْفـي وَعَن يَمـيني وَعَن شِمـالي ، وَمِن فَوْقـي ، وَأَعـوذُ بِعَظَمَـتِكَ أَن أُغْـتالَ مِن تَحْتـي.**\n| 1 |\n---\n**يَا حَيُّ يَا قيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أصْلِحْ لِي شَأنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَـرْفَةَ عَيْنٍ.**\n| 3 |\n---\n**أَصْبَـحْـنا وَأَصْبَـحْ المُـلكُ للهِ رَبِّ العـالَمـين ، اللّهُـمَّ إِنِّـي أسْـأَلُـكَ خَـيْرَ هـذا الـيَوْم ، فَـتْحَهُ ، وَنَصْـرَهُ ، وَنـورَهُ وَبَـرَكَتَـهُ ، وَهُـداهُ ، وَأَعـوذُ بِـكَ مِـنْ شَـرِّ ما فـيهِ وَشَـرِّ ما بَعْـدَه.**\n| 1 |\n---\n**اللّهُـمَّ عالِـمَ الغَـيْبِ وَالشّـهادَةِ فاطِـرَ السّماواتِ وَالأرْضِ رَبَّ كـلِّ شَـيءٍ وَمَليـكَه ، أَشْهَـدُ أَنْ لا إِلـهَ إِلاّ أَنْت ، أَعـوذُ بِكَ مِن شَـرِّ نَفْسـي وَمِن شَـرِّ الشَّيْـطانِ وَشِرْكِهِ ، وَأَنْ أَقْتَـرِفَ عَلـى نَفْسـي سوءاً أَوْ أَجُـرَّهُ إِلـى مُسْـلِم.**\n| 1 |\n---\n**أَعـوذُ بِكَلِمـاتِ اللّهِ التّـامّـاتِ مِنْ شَـرِّ ما خَلَـق.**\n| 3 |\n---\n**اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.**\n**من صلى عليه حين يصبح وحين يمسي أدركته شفاعته يوم القيامة.**\n| 10 |\n---\n**اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.**\n| 3 |\n---\n**اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.**\n| 3 |\n---\n**أسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لاَ إلَهَ إلاَّ هُوَ، الحَيُّ القَيُّومُ، وَأتُوبُ إلَيهِ.**\n| 3 |\n---\n**يَا رَبِّ، لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ، وَلِعَظِيمِ سُلْطَانِكَ.**\n| 3 |\n---\n**اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.**\n| 1 |\n---\n**اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ، عَلَيْكَ تَوَكَّلْتُ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ، مَا شَاءَ اللَّهُ كَانَ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ، وَلا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.**\n**ذكر طيب.**\n| 1 |\n---\n**لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِير.**\n**كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزًا من الشيطان.**\n| 100 |\n---\n**سُبْحـانَ اللهِ وَبِحَمْـدِهِ.**\n**حُطَّتْ خطاياه وإن كانت مثل زبد البحر، ولم يأت أحد يوم القيامة بأفضل مما جاء به إلا أحد قال مثل ما قال أو زاد عليه.**\n| 100 |\n---\n**أسْتَغْفِرُ اللهَ وَأتُوبُ إلَيْهِ**\n| 100 |\n---", "أذكار بعد الصلاة": "**أذكار بعد السلام من الصلاة المفروضة**\n\n**أَسْـتَغْفِرُ الله، أَسْـتَغْفِرُ الله، أَسْـتَغْفِرُ الله.**\n**اللّهُـمَّ أَنْـتَ السَّلامُ ، وَمِـنْكَ السَّلام ، تَبارَكْتَ يا ذا الجَـلالِ وَالإِكْـرام .**\n| 01 |\n\n---\n**لا إلهَ إلاّ اللّهُ وحدَهُ لا شريكَ لهُ، لهُ المُـلْكُ ولهُ الحَمْد، وهوَ على كلّ شَيءٍ قَدير، اللّهُـمَّ لا مانِعَ لِما أَعْطَـيْت، وَلا مُعْطِـيَ لِما مَنَـعْت، وَلا يَنْفَـعُ ذا الجَـدِّ مِنْـكَ الجَـد.**\n| 01 |\n\n---\n**لا إلهَ إلاّ اللّه, وحدَهُ لا شريكَ لهُ، لهُ الملكُ ولهُ الحَمد، وهوَ على كلّ شيءٍ قدير، لا حَـوْلَ وَلا قـوَّةَ إِلاّ بِاللهِ، لا إلهَ إلاّ اللّـه، وَلا نَعْـبُـدُ إِلاّ إيّـاه, لَهُ النِّعْـمَةُ وَلَهُ الفَضْل وَلَهُ الثَّـناءُ الحَـسَن، لا إلهَ إلاّ اللّهُ مخْلِصـينَ لَـهُ الدِّينَ وَلَوْ كَـرِهَ الكـافِرون.**\n| 01 |\n\n---\n**سُـبْحانَ اللهِ، والحَمْـدُ لله ، واللهُ أكْـبَر.**\n| 33 |\n\n---\n**لا إلهَ إلاّ اللّهُ وَحْـدَهُ لا شريكَ لهُ، لهُ الملكُ ولهُ الحَمْد، وهُوَ على كُلّ شَيءٍ قَـدير.**\n| 01 |\n\n---\n**بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم**\n**قُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ.**\n**بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم**\n**قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ...**\n**بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم**\n**قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ...**\n**ثلاث مرات بعد صلاتي الفجر والمغرب. ومرة بعد الصلوات الأخرى.**\n| 03 |\n\n---\n**أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ**\n**اللّهُ لاَ إِلَـهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ... [آية الكرسى - البقرة 255]**\n| 01 |\n\n---\n**لا إلهَ إلاّ اللّهُ وحْـدَهُ لا شريكَ لهُ، لهُ المُلكُ ولهُ الحَمْد، يُحيـي وَيُمـيتُ وهُوَ على كُلّ شيءٍ قدير.**\n**عَشْر مَرّات بَعْدَ المَغْرِب وَالصّـبْح.**\n| 10 |\n\n---\n**اللّهُـمَّ إِنِّـي أَسْأَلُـكَ عِلْمـاً نافِعـاً وَرِزْقـاً طَيِّـباً ، وَعَمَـلاً مُتَقَـبَّلاً.**\n**بَعْد السّلامِ من صَلاةِ الفَجْر.**\n| 01 |\n\n---\n**اللَّهُمَّ أَجِرْنِي مِنْ النَّار.**\n**بعد صلاة الصبح والمغرب.**\n| 07 |\n\n---\n**اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.**\n| 01 |", "تسابيح": "**تسابيح - تسبيح - السبحة - أذكار عظيمة**\n\n**سُبْحَانَ اللَّهِ**\n**يكتب له ألف حسنة أو يحط عنه ألف خطيئة.**\n| 100 |\n---\n**سُبْحَانَ اللَّهِ وَبِحَمْدِهِ**\n**حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ.**\n| 100 |\n---\n**سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ**\n**تَمْلَآَنِ مَا بَيْنَ السَّمَاوَاتِ وَالْأَرْضِ.**\n| 100 |\n---\n**سُبْحَانَ اللهِ العَظِيمِ وَبِحَمْدِهِ**\n**غرست له نخلة في الجنة (أى عدد).**\n| 100 |\n---\n**سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ**\n**ثقيلتان في الميزان حبيبتان إلى الرحمن (أى عدد).**\n| 100 |\n---\n**لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلُّ شَيْءِ قَدِيرِ.**\n**كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزا من الشيطان.**\n| 100 |\n---\n**لا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ**\n**كنز من كنوز الجنة (أى عدد).**\n| 100 |\n---\n**الْحَمْدُ للّهِ رَبِّ الْعَالَمِينَ**\n**تملأ ميزان العبد بالحسنات.**\n| 100 |\n---\n**الْلَّهُم صَلِّ وَسَلِم وَبَارِك عَلَى سَيِّدِنَا مُحَمَّد**\n**من صلى على حين يصبح وحين يمسى ادركته شفاعتى يوم القيامة.**\n| 100 |\n---\n**أستغفر الله**\n**لفعل الرسول صلى الله عليه وسلم.**\n| 100 |\n---\n**سُبْحَانَ الْلَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا الْلَّهُ، وَالْلَّهُ أَكْبَرُ**\n**أنهن أحب الكلام الى الله...**\n| 100 |\n---\n**لَا إِلَهَ إِلَّا اللَّهُ**\n**أفضل الذكر لا إله إلاّ الله.**\n| 100 |\n---\n**الْلَّهُ أَكْبَرُ**\n**من قال الله أكبر كتبت له عشرون حسنة وحطت عنه عشرون سيئة.**\n| 100 |\n---\n**سُبْحَانَ اللَّهِ ، وَالْحَمْدُ لِلَّهِ ، وَلا إِلَهَ إِلا اللَّهُ ، وَاللَّهُ أَكْبَرُ ، اللَّهُمَّ اغْفِرْ لِي ، اللَّهُمَّ ارْحَمْنِي ، اللَّهُمَّ ارْزُقْنِي.**\n**خير الدنيا والآخرة**\n| 100 |\n---\n**الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ.**\n| 100 |\n---\n**اللَّهُ أَكْبَرُ كَبِيرًا ، وَالْحَمْدُ لِلَّهِ كَثِيرًا ، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلاً.**\n| 100 |\n---\n**اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ...**\n| 100 |", "أذكار النوم": "**أذكار النوم والأحلام**\n\n**بِاسْمِكَ رَبِّـي وَضَعْـتُ جَنْـبي ، وَبِكَ أَرْفَعُـه، فَإِن أَمْسَـكْتَ نَفْسـي فارْحَـمْها ، وَإِنْ أَرْسَلْتَـها فاحْفَظْـها بِمـا تَحْفَـظُ بِه عِبـادَكَ الصّـالِحـين.** | 01 |\n---\n**اللّهُـمَّ إِنَّـكَ خَلَـقْتَ نَفْسـي وَأَنْـتَ تَوَفّـاهـا... اللّهُـمَّ إِنَّـي أَسْـأَلُـكَ العـافِـيَة.** | 01 |\n---\n**اللّهُـمَّ قِنـي عَذابَـكَ يَـوْمَ تَبْـعَثُ عِبـادَك.** | 03 |\n---\n**بِاسْـمِكَ اللّهُـمَّ أَمـوتُ وَأَحْـيا.** | 01 |\n---\n**الـحَمْدُ للهِ الَّذي أَطْـعَمَنا وَسَقـانا، وَكَفـانا، وَآوانا...** | 01 |\n---\n**اللّهُـمَّ عالِـمَ الغَـيبِ وَالشّـهادةِ...** | 01 |\n---\n**اللّهُـمَّ أَسْـلَمْتُ نَفْـسي إِلَـيْكَ، وَفَوَّضْـتُ أَمْـري إِلَـيْكَ...** | 01 |\n---\n**سُبْحَانَ اللَّهِ.** | 33 |\n---\n**الْحَمْدُ لِلَّهِ.** | 33 |\n---\n**اللَّهُ أَكْبَرُ.** | 34 |\n---\n**يجمع كفيه ثم ينفث فيهما والقراءة فيهما...** | 03 |\n---\n**سورة البقرة: أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ ... [البقرة 285-286]** | 01 |\n---\n**آية الكرسى: أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ ... [البقرة 255]** | 01 |\n---\n**أذكار من قلق في فراشه ولم ينم**\nعن بريدة رضي الله عنه... **اللهم رب السموات السبع...**\n**أعوذ بكلمات الله التامة من غضبه وشر عباده...** | 01 |\n---\n**أذكار الأحلام**\n**عن أبي قتادة رضي الله عنه... فمن رأى شيئا يكرهه فلينفث عن شماله ثلاثا...** | 01 |", "أذكار الاستيقاظ": "**الحَمْـدُ لِلّهِ الّذي أَحْـيانا بَعْـدَ ما أَماتَـنا وَإليه النُّـشور.** | 01 |\n---\n**الحمدُ للهِ الذي عافاني في جَسَدي وَرَدّ عَليّ روحي وَأَذِنَ لي بِذِكْرِه.** | 01 |\n---\n**لا إلهَ إلاّ اللّهُ وَحْـدَهُ لا شَـريكَ له، لهُ المُلـكُ ولهُ الحَمـد، وهوَ على كلّ شيءٍ قدير، سُـبْحانَ اللهِ، والحمْـدُ لله ، ولا إلهَ إلاّ اللهُ واللهُ أكبَر، وَلا حَولَ وَلا قوّة إلاّ باللّهِ العليّ العظيم. رَبِّ اغْفرْ لي.** | 01 |", "أذكار الآذان": "**ما يقال عند سماع الأذان**\n**يَقُولُ مِثْلَ مَا يَقُولُ الـمُؤَذِّنُ إلاَّ فِي \"حَيَّ عَلَى الصَّلاةِ وَحَيَّ عَلَى الفَلاَحِ\" فَيَقُولُ: \"لاَ حَوْلَ وَلا قُوَّةَ إلاَّ باللَّهِ\".** | 01 |\n---\n**مَنْ قَال حِينَ يسْمعُ المُؤذِّنَ : أَشْهَد أَنْ لا إِله إِلاَّ اللَّه وحده...** | 01 |\n---\n**إِذا سمِعْتُمُ النِّداءَ فَقُولُوا مِثْلَ ما يَقُولُ ، ثُمَّ صَلُّوا علَيَّ...** | 01 |\n---\n**اللَّهُمَّ رَبَّ هذِهِ الدَّعوةِ التَّامَّةِ ، والصَّلاةِ الْقَائِمةِ، آت مُحَمَّداً الْوسِيلَةَ...** | 01 |\n---\n**اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ. اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ...** | 01 |\n---\n**ما بين الأذان والإقامة فالدعاء عندئذٍ مرغّب فيه ومستحب...** | 01 |\n---\n**نص صيغة الأذان**\nاللهُ أكْبَرُ... لاَ إلَهَ إلاَّ اللهُ | 01 |\n---\n**نص صيغة أذان الفجر**\nاللهُ أكْبَرُ... الصلاةُ خيرٌ من النوم... | 01 |\n---\n**نص صيغة الإقامة**\nاللهُ أكْبَرُ... قد قامت الصلاة... | 01 |", "أذكار المسجد": "**دُعَاءُ الذَّهَابِ إلَى المَسْجِدِ**\n**اللّهُـمَّ اجْعَـلْ في قَلْبـي نورا ، وَفي لِسـاني نورا، وَاجْعَـلْ في سَمْعي نورا، وَاجْعَـلْ في بَصَري نورا، وَاجْعَـلْ مِنْ خَلْفي نورا، وَمِنْ أَمامـي نورا، وَاجْعَـلْ مِنْ فَوْقـي نورا ، وَمِن تَحْتـي نورا .اللّهُـمَّ أَعْطِنـي نورا.** | 01 |\n---\n**دُعَاءُ دُخُولِ المَسْجِدِ**\n**يَبْدَأُ بِرِجْلِهِ اليُمْنَى، وَيَقُولُ: أَعوذُ باللهِ العَظيـم... اللّهُـمَّ افْتَـحْ لي أَبْوابَ رَحْمَتـِك.** | 01 |\n---\n**دُعَاءُ الخُرُوجِ مِنَ المَسْجِدِ**\n**يَبْدَأُ بِرِجْلِهِ الْيُسْرَى... اللَّهُمَّ إنِّي أَسْأَلُكَ مِنْ فَضْلِكَ...** | 01 |", "أذكار الوضوء": "**الذكر قبل الوضوء**\n**قبل الوضوء: \"بِسْمِ ٱللّٰهِ\".** | 01 |\n---\n**الذكر بعد الوضوء**\n**أشْهَدُ أن لا إله إلا الله وحْدَهُ لا شريكَ لهُ...**\n**اللَّهُمَّ اجْعَلْني مِنَ التَّوَّابينَ واجْعَلْنِي من المُتَطَهِّرِينَ.**\n**سُبْحَانَكَ اللَّهُمَّ وبَحَمْدكَ أشْهدُ أنْ لا إلهَ إلا أنْتَ أَسْتَغْفِرُكَ وأتُوبُ إِلَيْكَ.** | 01 |", "أذكار المنزل": "**أذكار الدخول إلى المنزل**\n**بِسْـمِ اللهِ وَلَجْنـا، وَبِسْـمِ اللهِ خَـرَجْنـا، وَعَلـى رَبِّنـا تَوَكّلْـنا.** | 01 |\n---\n**أذكار الخروج من المنزل**\n**بِسْمِ اللهِ ، تَوَكَّلْـتُ عَلى اللهِ وَلا حَوْلَ وَلا قُـوَّةَ إِلاّ بِالله. اللّهُـمَّ إِنِّـي أَعـوذُ بِكَ أَنْ أَضِـلَّ أَوْ أُضَـل...** | 01 |", "أذكار الخلاء": "**الذكر عند الخلاء**\n**(بِسْمِ الله) اللّهُـمَّ إِنِّـي أَعـوذُ بِـكَ مِـنَ الْخُـبْثِ وَالْخَبائِث.** | 01 |\n---\n**الذكر بعد الخروج من الخلاء**\n**غُفْـرانَك.** | 01 |", "أذكار الطعام": "**الذكر عند الطعام والشراب**\n**بِسْمِ اللهِ. فإنْ نسي في أَوَّلِهِ، فَليَقُلْ: بِسْمِ اللَّه أَوَّلَهُ وَآخِرَهُ.** | 01 |\n---\n**الذكر عند شرب اللبن**\n**اَللَّهُمَّ بَارِكْ لَنَا فِيهِ, وَزِدْنَا مِنْهُ.** | 01 |\n---\n**الذكر عند الفراغ من الطعام والشراب**\n**الْحَمْدُ للهِ الَّذِي أَطْعَمَنِي هَذَا, وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِّنِّي وَلاَ قُوَّةٍ...** | 01 |\n---\n**أذكار الضيف**\n**أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ ، وَأَكَلَ طَعَامَكُمُ الأَبْرَارُ ، وَصَلَّتْ عَلَيْكُمُ الْمَلائِكَةُ.** | 01 |\n---\n**هدى النبى فى الشرب**\n**كَانَ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ يَشْرَبُ فِي ثَلاَثَةِ أَنْفَاسٍ...** | 01 |", "الأدعية القرآنية": "**\"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ\". [البقرة - 201].** | 01 |\n---\n**\"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ\". [البقرة - 250].** | 01 |\n---\n**\"رَبَّنَا لاَ تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا...\" [البقرة - 286].** | 01 |\n---\n**\"رَبَّنَا لاَ تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا...\" [آل عمران - 8].** | 01 |\n---\n**\"رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ\". [آل عمران - 16].** | 01 |\n---\n**\"رَبِّ هَبْ لِي مِن لَّدُنْكَ ذُرِّيَّةً طَيِّبَةً...\" [آل عمران - 38].** | 01 |\n---\n**\"رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ...\" [آل عمران - 53].** | 01 |\n---\n**\"ربَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا...\" [آل عمران - 147].** | 01 |\n---\n**\"رَبَّنَا مَا خَلَقْتَ هَذا بَاطِلاً...\" [آل عمران - 191-194].** | 01 |\n---\n**\"رَبَّنَا ظَلَمْنَا أَنفُسَنَا...\" [الأعراف - 23].** | 01 |\n---\n**\"رَبَّنَا لاَ تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ\". [الأعراف - 47].** | 01 |\n---\n**\"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ\". [الأعراف - 126].** | 01 |\n---\n**\"حَسْبِيَ اللّهُ لا إِلَـهَ إِلاَّ هُوَ...\" [التوبة - 129].** | 01 |\n---\n**\"رَبَّنَا لاَ تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ...\" [يونس - 85-86].** | 01 |\n---\n**\"رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ...\" [هود - 47].** | 01 |\n---\n**\"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلاَةِ وَمِن ذُرِّيَّتِي...\" [إبراهيم - 40].** | 01 |\n---\n**\"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ...\" [إبراهيم - 41].** | 01 |\n---\n**\"رَّبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ...\" [الإسراء - 80].** | 01 |\n---\n**\"رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً...\" [الكهف - 10].** | 01 |\n---\n**\"رَبِّ اشْرَحْ لِي صَدْرِي...\" [طه - 25-28].** | 01 |\n---\n**\"رَّبِّ زِدْنِي عِلْمًا\". [طه - 114].** | 01 |\n---\n**\"لا إِلَهَ إِلا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ\". [الأنبياء - 87].** | 01 |\n---\n**\"رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ\". [الأنبياء - 89].** | 01 |\n---\n**\"رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ...\" [المؤمنون - 97-98].** | 01 |\n---\n**\"رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا...\" [المؤمنون - 109].** | 01 |\n---\n**\"رَّبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ\". [المؤمنون - 118].** | 01 |", "أدعية الأنبياء": "**\"رَبَّنَا ظَلَمْنَا أَنفُسَنَا...\" [الأعراف - 23].**\n**آدم علية السلام.** | 01 |\n---\n**\"رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ...\" [نوح - 28].**\n**\"رَبِّ إِنِّي أَعُوذُ بِكَ...\" [هود - 47].**\n**\"رَّبِّ أَنزِلْنِي مُنزَلاً مُّبَارَكاً...\" [المؤمنون - 29].**\n**نوح علية السلام.** | 01 |\n---\n**\"رَبَّنَا تَقَبَّلْ مِنَّا...\" [البقرة - 127-128].**\n**\"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ...\" [إبراهيم - 40-41].**\n**\"رَبِّ هَبْ لِي حُكْمًا...\" [الشعراء - 83-85].**\n**\"رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا...\" [الممتحنة - 4-5].**\n**\"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ\" [الصافات - 100].**\n**إبراهيم علية السلام.** | 01 |\n---\n**\"إِنِّي تَوَكَّلْتُ عَلَى اللَّهِ رَبِّي وَرَبِّكُم...\" [هود - 56].**\n**هود علية السلام.** | 01 |\n---\n**\"رَبِّ انْصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ\" [العنكبوت - 30].**\n**\"رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ\" [الشعراء - 169].**\n**لوط علية السلام.** | 01 |\n---\n**\"فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنتَ وَلِيِّي...\" [يوسف - 101].**\n**يوسف علية السلام.** | 01 |\n---\n**\"وَسِعَ رَبُّنَا كُلَّ شَيْءٍ عِلْماً...\" [الأعراف - 89].**\n**شعيب علية السلام.** | 01 |\n---\n**\"رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي\" [القصص - 16].**\n**\"رَبِّ بِمَا أَنْعَمْتَ عَلَيَّ...\" [القصص - 17].**\n**\"رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ\" [القصص - 24].**\n**\"رَبِّ اشْرَحْ لِي صَدْرِي...\" [طه - 25-28].**\n**موسى علية السلام.** | 01 |\n---\n**\"أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ\" [الأنبياء - 83].**\n**أيوب علية السلام.** | 01 |\n---\n**\"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ...\" [النمل - 19].**\n**سليمان علية السلام.** | 01 |\n---\n**\"لَّا إِلَهَ إِلَّا أَنتَ سُبْحَانَكَ...\" [الأنبياء - 87].**\n**يونس علية السلام.** | 01 |\n---\n**\"رَبِّ هَبْ لِي مِن لَّدُنْكَ ذُرِّيَّةً طَيِّبَةً...\" [آل عمران - 38].**\n**\"رَبِّ لَا تَذَرْنِي فَرْداً...\" [الأنبياء - 89].**\n**زكريا علية السلام.** | 01 |\n---\n**\"إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ\" [يوسف - 86].**\n**يعقوب علية السلام.** | 01 |", "أذكار الحج والعمرة": "**أذكار الحج والعمرة**\n\n**قد ربط الله تعالى بين الحج والذكر...**\n**\"وَاذْكُرُوا اللَّهَ فِي أَيَّامٍ مَعْدُودَاتٍ \". [سورة البقرة - 203]**\n**\"وَأَذِّنْ فِي النَّاسِ بِالْحَجِّ...\" [سورة الحج - 28]**\n**\"إِنَّمَا جُعِلَ الطَّوَافُ... لِإِقَامَةِ ذِكْرِ اللَّهِ\".**\n| 00 |\n---\n**الذكر عند الاحرام**\n**\"سُبْحَانَ اللهِ وَالحَمْدُ للهِ وَالله أَكْبَرُ\"**\n**دعاء التلبية في الحج والعمرة:** \"لَبَّيْكَ اللَّهُمَّ لَبَّيْك...\"\n**الدعاء عند رؤية الكعبة:** \"اللهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ...\"\n**الدعاء عند استلام الحجر الأسود:** \"بِاسْمِ اللهِ وَاللهُ أَكْبَرُ\".\n**الدُّعاءُ بينَ الرُّكن اليماني والحجر الأسود:** \"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً...\"\n| 01 |\n---\n**الدعاء في الطواف**\n**\"اللهُمَّ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً...\"**\n**\"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ...\"**\n| 01 |\n---\n**الدعاء بعد ركعتي الطواف**\n**اللَّهُمَّ اعْصِمْنِي بِدِينِكَ...**\n| 01 |\n---\n**الدعاء عند صعود الصَّفَا والمروة**\n**\"لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ... وَهَزَمَ الْأحْزَابَ وَحْدَهُ\".**\n| 01 |\n---\n**الدعاء على الصفا**\n**\"اللَّهُمَّ إِنَّكَ قُلْتَ: {اِدْعُونِي أَسْتَجِبْ لَكُمْ}...\"**\n| 01 |\n---\n**الدعاء في السعي بين الصفا والمروة**\n**\"رَبِّ اغْفِرْ وَارْحَمْ إِنَّكَ أَنْتَ الْأَعَزُّ الْأَكْرَمُ\".**\n| 01 |\n---\n**الدعاء بعرفات**\n**\"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ...\"**\n| 01 |\n---\n**دعاء السلف الصالح في عرفات**\n**\"اللَّهُمَّ اهْدِنَا بِالْهُدَى، وَزَيِّنَّا بِالتَّقْوَى...\"**\n| 01 |\n---\n**الدعاء عند رمي جمرة العقبة عِنْدَ كُلِّ حَصَاة**\n**\"الله أَكْبَر، الله أَكْبَر، الله أَكْبَر\".**\n**\"اللَّهُمَّ اجْعَلْهُ حَجًّا مَبْرُورًا وَذَنْبًا مَغْفُورًا\".**\n| 01 |\n---\n**الذكر عند ذبح الأضاحي**\n**بسم الله , اللهم تقبل من محمد وآل محمد ومن أمة محمد**\n| 01 |\n---\n**دعاء الرجوع من الحج أو العمرة**\n**\"الله أَكْبَر، الله أَكْبَر، الله أَكْبَر\".**\n**\"لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ... آيِبُونَ، تَائِبُونَ، عَابِدُونَ، سَاجِدُونَ\".**\n| 01 |", "دعاء ختم القرآن الكريم": "**دُعَاءُ خَتْمِ القُرْآنِ الكَريمِ**\n\n**اللَّهُمَّ ارْحَمْنِي بالقُرْءَانِ وَاجْعَلهُ لِي إِمَاماً وَنُوراً وَهُدًى وَرَحْمَةً**\n\n**اللَّهُمَّ ذَكِّرْنِي مِنْهُ مَانَسِيتُ وَعَلِّمْنِي مِنْهُ مَاجَهِلْتُ وَارْزُقْنِي تِلاَوَتَهُ...**\n\n**اللَّهُمَّ أَصْلِحْ لِي دِينِي...**\n\n**اللَّهُمَّ اجْعَلْ خَيْرَ عُمْرِي آخِرَهُ...**\n\n**اللَّهُمَّ لَا تَدَعْ لَنَا ذَنْبًا إِلَّا غَفَرْتَهُ...**\n\n**رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً... وَصَلَّى اللهُ عَلَى سَيِّدِنَا وَنَبِيِّنَا مُحَمَّدٍ...**\n| 01 |", "فضل الدعاء": "**فضل الدعاء**\n\n**معنى الدعاء**\nالدعاء هو أن يطلبَ الداعي ما ينفعُه وما يكشف ضُرَّه؛ وحقيقته إظهار الافتقار إلى الله...\n\n**الدعاءُ طاعةٌ لله، وامتثال لأمره**\n**\"وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ...\" [غافر: 60]**\n\n**الدعاء عبادة**\n**\"الدُّعَاءُ هُوَ الْعِبَادَةُ\".**\n\n**الدعاء أكرم شيء على الله تعالى**\n**\"لَيْسَ شَيْءٌ أَكْرَمَ عَلَى اللَّهِ تَعَالَى مِنْ الدُّعَاءِ\".**\n\n**الدعاء سبب لدفع غضب الله**\n**\"مَنْ لَمْ يَسْأَلْ اللَّهَ يَغْضَبْ عَلَيْهِ\".**\n\n**الدعاء سلامة من العجز**\n**\"أَعْجَزُ النَّاسِ مَنْ عَجَزَ عَنْ الدُّعَاءِ...\"**\n\n**الدعاء سبب لرفع البلاء**\n**\"إِنَّ الدُّعَاءَ يَنْفَعُ مِمَّا نَزَلَ وَمِمَّا لَمْ يَنْزِلْ...\"**\n\n**الداعي في معيةُ الله**\n**\"أَنَا عِنْدَ ظَنِّ عَبْدِي بِي وَأَنَا مَعَهُ إِذَا دَعَانِي\".**\n\n**فضل الدعاء في السجود**\n**\"أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ... وَهُوَ سَاجِدٌ، فَأَكْثِرُوا الدُّعَاءَ\".**\n\n**فضل الدعاء بالليل**\n**\"إِنَّ فِي اللَّيْلِ لَسَاعَةٌ...\"**\n\n**فضل الدعاء للمسلمين بظهر الغيب**\n**\"مَا مِنْ عَبْدٍ مُسْلِمٍ يَدْعُو لِأَخِيهِ بِظَهْرِ الْغَيْبِ...\"**\n| 01 |", "أذكار متفرقة": "**دعاء لبس الثوب**\n**الحمدُ للهِ الّذي كَساني هذا (الثّوب) وَرَزَقَنيه مِنْ غَـيـْرِ حَولٍ مِنّي وَلا قـوّة.** | 01 |\n---\n**دعاء لبس الثوب الجديد**\n**اللهم لك الحمد أنت كسوتنيه، أسألك من خيره** | 01 |\n---\n**دعاء الكرب**\n**لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات، ورب الأرض ورب العرش الكريم. اللهم رحمتك أرجو فلا تكلني إلى نفسي طرفة عين وأصلح لي شأني كله، لا إله إلا أنت. لا إله إلا أنت سبحانك إني كنت من الظالمين. الله الله رب لا أشرك به شيئا.** | 01 |\n---\n**دعاء الهم والحزن**\n**اللهم إني عبدك ابن عبدك ابن أمتك ناصيتي بيدك ماض في حكمك، عدل في قضاؤك أسألك بكل اسم هو لك سميت به نفسك أو أنزلته في كتابك، أو علمته أحداً من خلقك أو استأثرت به في علم الغيب عندك أن تجعل القرآن ربيع قلبي، ونور صدري وجلاء حزني وذهاب همي.** | 01 |\n---\n**دعاء قضاء الدين**\n**اللهم اكفنى بحلالك عن حرامك وأغننى بفضلك عمن سواك** | 01 |\n---\n**دعاء الريح**\n**اللهم إنى أسألك خيرها، وخير ما فيها، وخير ما أرسلت به، وأعوذ بك من شرها، وشر ما فيها وشر ما أرسلت به.** | 01 |\n---\n**دعاء الرعد**\n**سبحان الله الذي يسبح الرعد بحمده والملائكة من خيفته** | 01 |\n---\n**دعاء زيارة القبور**\n**السلام عليكم أهل الديار من المؤمنين والمسلمين، وإنا إن شاء الله بكم لاحقون ويرحم الله المستقدمين منا والمستأخرين، أسأل الله لنا ولكم العافية.** | 01 |\n---\n**دعاء نزول المطر**\n**اللهم صيباَ نافعاَ** | 01 |\n---\n**دعاء ركوب الدابة**\n**بسم الله، الحمد لله، سبحان الذي سخر لنا هذا وماكنا له مقرنين وإنا إلى ربنا لمنقلبون، الحمد لله، الحمد لله، الحمد لله، الله اكبر، الله أكبر، الله أكبر، سبحانك اللهم إني ظلمت نفسي فاغفر لي، فإنه لايغفر الذنوب إلا أنت.** | 01 |\n---\n**دعاء السفر**\n**اللهم إنا نسألك في سفرنا هذا البر والتقوى، ومن العمل ماترضى، اللهم هون علينا سفرنا هذا واطو عنا بعده، اللهم أنت الصاحب في السفر، والخليفة في الأهل، اللهم إني أعوذ بك من وعثاء السفر وكآبة المنظر وسوء المنقلب في المال والأهل. وإذا رجع قال: آيبون، تائبون، عابدون، لربنا حامدون.** | 01 |\n---\n**دعاء المسافر للمقيم**\n**استودعكم الله الذي لا تضيع ودائعه** | 01 |\n---\n**دعاء المقيم للمسافر**\n**أستودع الله دينك وأمانتك، وخواتيم عملك، زودك الله التقوى، وغفر ذنبك، ويسر لك الخير حيث ما كنت** | 01 |\n---\n**دعاء النزول في مكان**\n**أعوذ بكلمات الله التامات من شر ما خلق** | 0
